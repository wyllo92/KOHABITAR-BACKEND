<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zonas Comunes</title>
  <!-- Favicon -->
  <link rel="icon" href="../../assets/img/logos/logo.png" type="image/png">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome para iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Data table -->
  <link rel="stylesheet" href="https://cdn.datatables.net/2.3.2/css/dataTables.dataTables.css">
  <!-- Loading -->
  <link rel="stylesheet" href="../../assets/css/loading.css">
</head>

<body>
 
  <!--Container -->
  <div class="container-fluid d-flex flex-column min-vh-100">
   
    <!--Content data-->
    <main>
      <h1 class="text-center mb-4">Gestión de Zonas Comunes</h1>
      <button type="button" title="Agregar Amenidad" class="btn btn-primary mb-3" onclick="add()">
        <i class="fa fa-swimming-pool me-1"></i>Agregar Zona Común
      </button>

      <!--Table-->
      <div class="table-responsive">
        <table class="table table-bordered table-hover bg-white shadow-sm text-center" id="app-table">
          <thead class="thead-dark">
            <tr class="table-secondary text-center">
              <th class="text-center">#</th>
              <th class="text-center">Nombre</th>
              <th class="text-center">Tipo</th>
              <th class="text-center">Capacidad</th>
              <th class="text-center">Estado</th>
              <th class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody id="app-table-body" class="text-center">
          </tbody>
          <tfoot>
            <tr class="table-secondary text-center">
              <td class="text-center">#</td>
              <td class="text-center">Nombre</td>
              <td class="text-center">Tipo</td>
              <td class="text-center">Capacidad</td>
              <td class="text-center">Estado</td>
              <td class="text-center">Acciones</td>
            </tr>
          </tfoot>
        </table>
      </div>

      <!-- Modal -->
      <div class="modal fade" id="appModal" tabindex="-1" aria-labelledby="appModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="appModalLabel">Zona Común</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <!--Form-->
              <form id="amenityForm">
                <div class="row">
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="name" class="form-label required">Nombre de la Zona Común</label>
                      <div class="form-floating">
                        <input type="text" class="form-control" placeholder="Nombre de la zona común" id="name" name="name" required value="">
                        <label for="name">Nombre de la Zona Común</label>
                      </div>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="amenity_type_id" class="form-label required">Tipo de Zona Común</label>
                      <select class="form-select" id="amenity_type_id" name="amenity_type_id" required>
                        <option value="" selected disabled>Selecciona el tipo</option>
                      </select>
                    </div>
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="capacity" class="form-label">Capacidad</label>
                      <div class="form-floating">
                        <input type="number" class="form-control" placeholder="Capacidad de personas" id="capacity" name="capacity" value="">
                        <label for="capacity">Capacidad de Personas</label>
                      </div>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="status_id" class="form-label">Estado</label>
                      <select class="form-select edit-input" id="status_id" name="status_id">
                        <option value="1" selected>Activo</option>
                        <option value="2">Inactivo</option>
                      </select>
                    </div>
                  </div>
                </div>
                <div class="mb-3">
                  <label for="description" class="form-label">Descripción</label>
                  <div class="form-floating">
                    <textarea class="form-control" placeholder="Descripción de la zona común" id="description" name="description" style="height: 100px"></textarea>
                    <label for="description">Descripción de la Zona Común</label>
                  </div>
                </div>
                <div class="col-12 d-flex justify-content-between mt-3">
                  <button type="reset" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-counterclockwise me-1"></i> Resetear
                  </button>
                  <button type="submit" class="btn btn-success">
                    <i class="bi bi-send-fill me-1"></i> Enviar
                  </button>
                </div>
              </form>
              <!--End Form-->
            </div>
          </div>
        </div>
      </div>
      <!-- End Modal -->

    </main>
    <!--End Content data-->

  </div>
  <!--End Container -->
 
  <!--Loading -->
  <div id="loading-screen">
    <div class="spinner-border text-light spinner" role="status">
      <span class="visually-hidden">Loading ...</span>
    </div>
    <p class="mt-3">Cargando datos, por favor espera...</p>
  </div>
  <!--End Loading -->

  <!-- Bootstrap 5 JS Bundle con Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Data table -->
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <script src="https://cdn.datatables.net/2.3.2/js/dataTables.js"></script>
  <!-- JS personalizado -->
  <script src="../../assets/js/app/constants.js"></script>
  <script src="../../assets/js/storage/appStorage.js"></script>
  <script src="../../assets/js/services/services.js"></script> 
  <script src="../../assets/js/app/app.js"></script>
  <script src="../../assets/js/utils/Form.js"></script>
  <script src="../../assets/js/controllers/amenity/amenity.controller.js"></script>

</body>

</html>
