<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Recuperar Contraseña - KOHABITAR</title>

  <!-- El sistema carga las dependencias CSS necesarias para el formulario -->
  <link rel="icon" href="../../assets/img/icons/icono-kohabitar.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/loading.css">
  <link rel="stylesheet" href="../../assets/css/login.css">
</head>

<body class="d-flex justify-content-center align-items-center" style="min-height: 100vh; background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);">

  <!--
    TARJETA DE RECUPERACIÓN DE CONTRASEÑA
    El sistema presenta un formulario para que el usuario solicite restablecer su contraseña
  -->
  <div class="card shadow-lg" style="width: 100%; max-width: 500px; border-radius: 15px;">

    <!--
      ENCABEZADO DE LA TARJETA
      El sistema muestra el título y un ícono representativo
    -->
    <div class="card-header text-center text-white" style="background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%); border-radius: 15px 15px 0 0;">
      <i class="fas fa-key fa-3x mb-2"></i>
      <h4 class="mb-0">Recuperar Contraseña</h4>
    </div>

    <!--
      CUERPO DE LA TARJETA
    -->
    <div class="card-body p-4">

      <!--
        INSTRUCCIONES PARA EL USUARIO
        El sistema informa al usuario sobre el proceso de recuperación
      -->
      <div class="alert alert-info" role="alert">
        <i class="fas fa-info-circle me-2"></i>
        Ingresa tu correo electrónico registrado y te enviaremos un enlace para restablecer tu contraseña.
      </div>

      <!--
        FORMULARIO DE RECUPERACIÓN
        El sistema captura el email del usuario para enviar el enlace de recuperación
      -->
      <form id="forgotPasswordForm">

        <!--
          CAMPO DE EMAIL
          El sistema valida que el email tenga formato correcto
        -->
        <div class="mb-4">
          <label for="email" class="form-label fw-semibold">
            <i class="fas fa-envelope me-1"></i> Correo Electrónico
          </label>
          <input
            type="email"
            class="form-control form-control-lg"
            id="email"
            name="email"
            placeholder="ejemplo@correo.com"
            required
          >
          <div class="invalid-feedback">Por favor ingresa un correo electrónico válido</div>
        </div>

        <!--
          MENSAJES DE ÉXITO O ERROR
          El sistema muestra mensajes dinámicos según el resultado
        -->
        <div id="successMessage" class="alert alert-success d-none" role="alert">
          <i class="fas fa-check-circle me-2"></i>
          <span id="successText"></span>
        </div>

        <div id="errorMessage" class="alert alert-danger d-none" role="alert">
          <i class="fas fa-exclamation-triangle me-2"></i>
          <span id="errorText"></span>
        </div>

        <!--
          BOTÓN DE ENVÍO
          El sistema envía la solicitud de recuperación al backend
        -->
        <button type="submit" class="btn btn-primary btn-lg w-100 mb-3" id="submitBtn">
          <span class="spinner-border spinner-border-sm d-none me-2" id="submitSpinner"></span>
          <i class="fas fa-paper-plane me-2"></i>
          Enviar Enlace de Recuperación
        </button>

        <!--
          ENLACES DE NAVEGACIÓN
          El sistema permite regresar al login o a la página principal
        -->
        <div class="text-center mt-3">
          <a href="index.html" class="text-decoration-none me-3" style="color: #2c3e50; font-weight: 500;">
            <i class="fas fa-arrow-left me-1"></i> Volver al Login
          </a>
          <span class="text-muted">|</span>
          <a href="../../index.html" class="text-decoration-none ms-3" style="color: #2c3e50; font-weight: 500;">
            <i class="fas fa-home me-1"></i> Página Principal
          </a>
        </div>
      </form>
    </div>
  </div>

  <!--
    PANTALLA DE CARGA
    El sistema muestra un spinner mientras procesa la solicitud
  -->
  <div id="loading-screen">
    <div class="spinner-border text-light spinner" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
    <p class="mt-3">Procesando solicitud, por favor espere...</p>
  </div>

  <!--
    DEPENDENCIAS JAVASCRIPT
    El sistema carga las librerías y scripts necesarios
  -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/app/constants.js"></script>
  <script src="../../assets/js/storage/appStorage.js"></script>
  <script src="../../assets/js/services/services.js"></script>
  <script src="../../assets/js/app/app.js"></script>

  <!--
    SCRIPT DE RECUPERACIÓN DE CONTRASEÑA
    El sistema maneja el envío del formulario y la comunicación con el backend
  -->
  <script>
    // El sistema obtiene referencias a los elementos del DOM
    const form = document.getElementById('forgotPasswordForm');
    const emailInput = document.getElementById('email');
    const submitBtn = document.getElementById('submitBtn');
    const submitSpinner = document.getElementById('submitSpinner');
    const successMessage = document.getElementById('successMessage');
    const successText = document.getElementById('successText');
    const errorMessage = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');

    /**
     * El sistema oculta todos los mensajes de alerta
     */
    function hideMessages() {
      successMessage.classList.add('d-none');
      errorMessage.classList.add('d-none');
    }

    /**
     * El sistema muestra un mensaje de éxito
     * @param {string} message - Mensaje a mostrar
     */
    function showSuccess(message) {
      hideMessages();
      successText.textContent = message;
      successMessage.classList.remove('d-none');
    }

    /**
     * El sistema muestra un mensaje de error
     * @param {string} message - Mensaje a mostrar
     */
    function showError(message) {
      hideMessages();
      errorText.textContent = message;
      errorMessage.classList.remove('d-none');
    }

    /**
     * El sistema maneja el envío del formulario
     */
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // El sistema valida que el campo de email no esté vacío
      if (!emailInput.value.trim()) {
        emailInput.classList.add('is-invalid');
        return;
      }

      emailInput.classList.remove('is-invalid');
      hideMessages();

      // El sistema muestra el indicador de carga
      submitBtn.disabled = true;
      submitSpinner.classList.remove('d-none');
      toggleLoading(true);

      try {
        // El sistema prepara los datos para enviar al backend
        const requestData = {
          email: emailInput.value.trim()
        };

        // El sistema envía la solicitud al endpoint de recuperación de contraseña
        const response = await fetch(URL_PASSWORD_RESET, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(requestData)
        });

        const data = await response.json();

        // El sistema procesa la respuesta del servidor
        if (response.ok) {
          // El sistema muestra mensaje de éxito
          showSuccess(data.message || 'Se ha enviado un enlace de recuperación a tu correo electrónico. Por favor revisa tu bandeja de entrada.');

          // El sistema limpia el formulario después de 2 segundos
          setTimeout(() => {
            form.reset();
          }, 2000);
        } else {
          // El sistema muestra el error devuelto por el servidor
          showError(data.error || 'No se pudo procesar la solicitud. Por favor verifica tu correo electrónico.');
        }
      } catch (error) {
        // El sistema maneja errores de conexión o del servidor
        console.error('Error al solicitar recuperación de contraseña:', error);
        showError('Error de conexión. Por favor verifica tu conexión a internet e intenta nuevamente.');
      } finally {
        // El sistema oculta el indicador de carga
        submitBtn.disabled = false;
        submitSpinner.classList.add('d-none');
        toggleLoading(false);
      }
    });

    /**
     * El sistema valida el formato del email en tiempo real
     */
    emailInput.addEventListener('blur', () => {
      if (emailInput.value.trim() && !emailInput.validity.valid) {
        emailInput.classList.add('is-invalid');
      } else {
        emailInput.classList.remove('is-invalid');
      }
    });
  </script>

</body>
</html>
