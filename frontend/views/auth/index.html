<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Iniciar Sesión - KOHABITAR</title>

  <!--
    DEPENDENCIAS CSS
    El sistema carga los estilos necesarios para la página de login
  -->
  <link rel="icon" href="../../assets/img/icons/icono-kohabitar.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/2.3.2/css/dataTables.dataTables.css">
  <link rel="stylesheet" href="../../assets/css/loading.css">
  <link rel="stylesheet" href="../../assets/css/login.css">
</head>

<body class="d-flex justify-content-center align-items-center" style="min-height: 100vh; background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);">

  <!--
    TARJETA DE INICIO DE SESIÓN
    El sistema presenta el formulario de autenticación
  -->
  <div class="card shadow-lg" style="width: 100%; max-width: 400px; border-radius: 15px;">
    <div class="card-header text-center text-white" style="background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%); border-radius: 15px 15px 0 0;">
      <i class="fas fa-user-circle fa-3x mb-2"></i>
      <h4 class="mb-0">Iniciar Sesión</h4>
    </div>
    <div class="card-body p-4">
      <form id="loginForm">

        <!--
          CAMPO DE USUARIO
          El sistema captura el nombre de usuario
        -->
        <div class="mb-3">
          <label for="user" class="form-label fw-semibold">
            <i class="fas fa-user me-1"></i> Usuario
          </label>
          <input type="text" class="form-control form-control-lg" id="user" name="username" required>
          <div class="invalid-feedback">Por favor ingresa un usuario válido</div>
        </div>

        <!--
          CAMPO DE CONTRASEÑA
          El sistema captura la contraseña con opción de mostrar/ocultar
        -->
        <div class="mb-3 position-relative">
          <label for="password" class="form-label fw-semibold">
            <i class="fas fa-lock me-1"></i> Contraseña
          </label>
          <input type="password" class="form-control form-control-lg" id="password" name="password" required>
          <i class="fa-solid fa-eye position-absolute" id="togglePassword"
             style="right: 15px; top: 70%; transform: translateY(-50%); cursor: pointer; color: #6c757d;"></i>
          <div class="invalid-feedback">La contraseña es requerida</div>
        </div>

        <!--
          MENSAJES DE ERROR
          El sistema muestra errores de autenticación
        -->
        <div id="loginError" class="alert alert-danger d-none" role="alert"></div>

        <!--
          BOTÓN DE INGRESO
          El sistema procesa la autenticación al hacer clic
        -->
        <button type="submit" class="btn btn-lg w-100 mb-3 text-white" style="background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%); border: none;" id="loginBtn">
          <span class="spinner-border spinner-border-sm d-none" id="loginSpinner"></span>
          <i class="fas fa-sign-in-alt me-2"></i> Ingresar
        </button>

        <!--
          ENLACES DE NAVEGACIÓN
          El sistema permite recuperar contraseña o volver a la página principal
        -->
        <div class="text-center">
          <a href="forgot-password.html" class="text-decoration-none me-3" style="color: #2c3e50; font-weight: 500;">
            <i class="fas fa-key me-1"></i> ¿Olvidaste tu contraseña?
          </a>
          <span class="text-muted">|</span>
          <a href="../../index.html" class="text-decoration-none ms-3" style="color: #2c3e50; font-weight: 500;">
            <i class="fas fa-home me-1"></i> Página Principal
          </a>
        </div>
      </form>
    </div>
  </div>

  <!--
    PANTALLA DE CARGA
    El sistema muestra un spinner mientras procesa la autenticación
  -->
  <div id="loading-screen">
    <div class="spinner-border text-light spinner" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
    <p class="mt-3">Procesando autenticación, por favor espere...</p>
  </div>

  <!--
    DEPENDENCIAS JAVASCRIPT
    El sistema carga las librerías y scripts necesarios
  -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <script src="https://cdn.datatables.net/2.3.2/js/dataTables.js"></script>
  <script src="../../assets/js/app/constants.js"></script>
  <script src="../../assets/js/storage/appStorage.js"></script>
  <script src="../../assets/js/services/services.js"></script>
  <script src="../../assets/js/app/app.js"></script>
  <script src="../../assets/js/utils/Form.js"></script>
  <script src="../../assets/js/controllers/auth/login.controller.js"></script>

  <!--
    SCRIPT DE MOSTRAR/OCULTAR CONTRASEÑA
    El sistema permite al usuario ver u ocultar la contraseña ingresada
  -->
  <script>
    // El sistema obtiene referencias a los elementos del DOM
    const togglePassword = document.querySelector("#togglePassword");
    const passwordInput = document.querySelector("#password");

    /**
     * El sistema alterna la visibilidad de la contraseña
     */
    togglePassword.addEventListener("click", function () {
      const type = passwordInput.type === "password" ? "text" : "password";
      passwordInput.type = type;
      this.classList.toggle("fa-eye");
      this.classList.toggle("fa-eye-slash");
    });

    // El sistema registra la inicialización exitosa de la página
    console.info('[KOHABITAR] El sistema ha cargado la página de login correctamente');
  </script>

</body>
</html>
