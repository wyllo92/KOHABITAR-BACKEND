<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Login</title>

  <!-- Dependencias CSS -->
  <link rel="icon" href="../../assets/img/icons/icono-kohabitar.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/2.3.2/css/dataTables.dataTables.css">
  <link rel="stylesheet" href="../../assets/css/loading.css">
  <link rel="stylesheet" href="../../assets/css/login.css">
</head>

<body class="d-flex justify-content-center align-items-center" style="height: 100vh;">

  <!-- Tarjeta Login -->
  <div class="card shadow" style="width: 100%; max-width: 400px;">
    <div class="card-header text-center">
      <h4>Iniciar Sesión</h4>
    </div>
    <div class="card-body">
      <form id="loginForm">
        
        <!-- Usuario -->
        <div class="mb-3">
          <label for="user" class="form-label">Usuario</label>
          <input type="text" class="form-control" id="user" name="username" required>
          <div class="invalid-feedback">Por favor ingresa un usuario válido</div>
        </div>

        <!-- Contraseña con icono para mostrar/ocultar -->
        <div class="mb-3 position-relative">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" name="password" required>
          <i class="fa-solid fa-eye position-absolute" id="togglePassword"
             style="right: 15px; top: 70%; transform: translateY(-50%); cursor: pointer; color: #6c757d;"></i>
          <div class="invalid-feedback">La contraseña es requerida</div>
        </div>

        <!-- Errores dinámicos -->
        <div id="loginError" class="alert alert-danger d-none" role="alert"></div>

        <!-- Botón ingresar -->
        <button type="submit" class="btn btn-primary w-100 mb-3" id="loginBtn">
          <span class="spinner-border spinner-border-sm d-none" id="loginSpinner"></span>
          Ingresar
        </button>

        <!-- Enlace recuperar contraseña -->
        <div class="text-center">
          <a href="forgot-password.html" class="text-decoration-none">¿Olvidaste tu contraseña?</a>
        </div>
      </form>
    </div>
  </div>

  <!-- Pantalla de carga -->
  <div id="loading-screen">
    <div class="spinner-border text-light spinner" role="status">
      <span class="visually-hidden">Loading ...</span>
    </div>
    <p class="mt-3">Data loading, please wait...</p>
  </div>

  <!-- Dependencias JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <script src="https://cdn.datatables.net/2.3.2/js/dataTables.js"></script>
  <script src="../../assets/js/app/constants.js"></script>
  <script src="../../assets/js/storage/appStorage.js"></script>
  <script src="../../assets/js/services/services.js"></script>
  <script src="../../assets/js/app/app.js"></script>
  <script src="../../assets/js/utils/Form.js"></script>
  <script src="../../assets/js/controllers/auth/login.controller.js"></script>

  <!-- Script mostrar/ocultar contraseña -->
  <script>
    const togglePassword = document.querySelector("#togglePassword");
    const passwordInput = document.querySelector("#password");

    togglePassword.addEventListener("click", function () {
      const type = passwordInput.type === "password" ? "text" : "password";
      passwordInput.type = type;
      this.classList.toggle("fa-eye");
      this.classList.toggle("fa-eye-slash");
    });
  </script>

</body>
</html>
