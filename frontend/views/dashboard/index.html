<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="icon" href="../../assets/img/logos/logo.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/loading.css">
    <style>
        .stat-card {
            cursor: pointer;
        }

        .stat-value {
            font-size: 1.6rem;
            font-weight: 700;
        }

        .card-compact {
            padding: 1rem;
        }

        .chart-card {
            min-height: 320px;
        }
    </style>
</head>

<body>
    <div class="container-fluid py-3">
        <header class="mb-3">
            <h2 class="mb-0">Panel de control</h2>
            <small class="text-muted">Resumen rápido del conjunto residencial</small>
        </header>

        <!-- Top stats -->
        <div class="row g-3 mb-3">
            <div class="col-sm-6 col-md-3">
                <div class="card stat-card" id="card-users" style="background-color:#2c3e50;">
                    <div class="card-body card-compact text-center">
                        <div class="text-light">Usuarios</div>
                        <div class="stat-value text-light" id="stat-users">0</div>
                        <small class="text-light" id="stat-users-sub">registrados</small>
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-md-3">
                <div class="card stat-card" id="card-parkings" style="background-color: #18bc9c;">
                    <div class="card-body card-compact text-center">
                        <div class="text-light">Parqueaderos</div>
                        <div class="stat-value text-light" id="stat-parkings">0</div>
                        <small class="text-light" id="stat-parkings-sub">Disponibles</small>
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-md-3">
                <div class="card stat-card" id="card-properties" style="background-color: #3498db;">
                    <div class="card-body card-compact text-center">
                        <div class="text-light">Propiedades</div>
                        <div class="stat-value text-light" id="stat-properties">0</div>
                        <small class="text-light">Activas</small>
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-md-3">
                <div class="card stat-card" id="card-payments" style="background-color: #7b8a8b;">
                    <div class="card-body card-compact text-center">
                        <div class="text-light">Pagos</div>
                        <div class="stat-value text-light" id="stat-payments">$0</div>
                        <small class="text-light">Total</small>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts -->
        <div class="row g-3">
            <div class="col-lg-6">
                <div class="card chart-card">
                    <div class="card-header bg-primary text-dark">Evolución del Fondo de Reserva</div>
                    <div class="card-body">
                        <canvas id="chart-reserve" width="400" height="250"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card chart-card">
                    <div class="card-header bg-danger text-dark">Incidencias Reportadas (PQRS)</div>
                    <div class="card-body">
                        <canvas id="chart-incidents" width="400" height="250"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Small footer metrics -->
        <div class="row g-3 mt-3">
            <div class="col-12 text-end text-muted">
                <small>Última actualización: <span id="dashboard-updated">—</span></small>
            </div>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading-screen">
        <div class="spinner-border text-light spinner" role="status">
            <span class="visually-hidden">Loading ...</span>
        </div>
        <p class="mt-3">Cargando datos, por favor espere...</p>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="../../assets/js/app/constants.js"></script>
    <script src="../../assets/js/storage/appStorage.js"></script>
    <script src="../../assets/js/services/services.js"></script>
    <script src="../../assets/js/app/app.js"></script>
    <script src="../../assets/js/controllers/dashboard/dashboard.controller.js"></script>

    <script>
        // Small navigation helpers for cards
        document.getElementById('card-users').addEventListener('click', () => { if (window.parent && window.parent.changeIframeView) window.parent.changeIframeView('user'); });
        document.getElementById('card-parkings').addEventListener('click', () => { if (window.parent && window.parent.changeIframeView) window.parent.changeIframeView('parkingslot'); });
        document.getElementById('card-properties').addEventListener('click', () => { if (window.parent && window.parent.changeIframeView) window.parent.changeIframeView('property'); });
        document.getElementById('card-payments').addEventListener('click', () => { if (window.parent && window.parent.changeIframeView) window.parent.changeIframeView('payment'); });
    </script>
</body>

</html>
