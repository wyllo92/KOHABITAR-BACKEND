<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Notificaciones</title>

  <!-- Favicon -->
  <link rel="icon" href="../../assets/img/logos/logo.png" type="image/png">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- DataTables -->
  <link rel="stylesheet" href="https://cdn.datatables.net/2.3.2/css/dataTables.dataTables.css">

  <!-- Loading -->
  <link rel="stylesheet" href="../../assets/css/loading.css">
</head>

<body style="display: none; opacity: 0;">
  <!-- Contenedor principal -->
  <div class="container-fluid d-flex flex-column min-vh-100">
    <main class="flex-fill">
      <h1 class="text-center mb-4 mt-3">
        <i class="fas fa-bell text-primary me-2"></i>Gestión de Notificaciones
      </h1>

      <!-- Botón agregar -->
      <div class="text-end mb-3">
        <button type="button" class="btn btn-primary" title="Agregar Notificación" onclick="add()">
          <i class="fas fa-plus me-1"></i>Nueva Notificación
        </button>
      </div>

      <!-- Tabla de notificaciones -->
      <div class="table-responsive">
        <table class="table table-dark table-hover" id="app-table">
          <thead>
            <tr class="table-primary text-center">
              <th style="width: 5%;">#</th>
              <th style="width: 15%;">Título</th>
              <th style="width: 20%;">Mensaje</th>
              <th style="width: 15%;">Propiedad</th>
              <th style="width: 12%;">Usuario</th>
              <th style="width: 10%;">Estado</th>
              <th style="width: 13%;">Fecha</th>
              <th style="width: 10%;">Acciones</th>
            </tr>
          </thead>
          <tbody id="app-table-body" class="text-center">
            <!-- Contenido dinámico -->
          </tbody>
          <tfoot>
            <tr class="table-primary text-center">
              <th>#</th>
              <th>Título</th>
              <th>Mensaje</th>
              <th>Propiedad</th>
              <th>Usuario</th>
              <th>Estado</th>
              <th>Fecha</th>
              <th>Acciones</th>
            </tr>
          </tfoot>
        </table>
      </div>
    </main>
  </div>

  <!-- Modal de notificación -->
  <div class="modal fade" id="appModal" tabindex="-1" aria-labelledby="appModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h1 class="modal-title fs-5" id="appModalLabel">
            <i class="fas fa-bell me-2"></i>Formulario de Notificación
          </h1>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>

        <div class="modal-body">
          <!-- Formulario -->
          <form id="notificationForm">
            <div class="row">
              <!-- Título -->
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="notification_title" class="form-label">
                    Título <span class="text-danger">*</span>
                  </label>
                  <div class="form-floating">
                    <input 
                      type="text" 
                      class="form-control edit-input" 
                      id="notification_title"
                      name="notification_title" 
                      placeholder="Título de la notificación" 
                      maxlength="100"
                      required>
                    <label for="notification_title">Título de la Notificación</label>
                  </div>
                  <div class="form-text">Máximo 100 caracteres</div>
                </div>
              </div>

              <!-- Estado -->
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="status_id" class="form-label">
                    Estado <span class="text-danger">*</span>
                  </label>
                  <select class="form-select edit-input" id="status_id" name="status_id" required>
                    <option value="" selected disabled>Selecciona el estado</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="row">
              <!-- Usuario destinatario -->
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="user_id" class="form-label">
                    Usuario Destinatario <span class="text-danger">*</span>
                  </label>
                  <select class="form-select edit-input" id="user_id" name="user_id" required>
                    <option value="" selected disabled>Selecciona el usuario</option>
                  </select>
                </div>
              </div>

              <!-- Propiedad -->
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="property_id" class="form-label">
                    Propiedad <span class="text-danger">*</span>
                  </label>
                  <select class="form-select edit-input" id="property_id" name="property_id" required>
                    <option value="" selected disabled>Selecciona la propiedad</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- Mensaje -->
            <div class="mb-3">
              <label for="notification_message" class="form-label">
                Mensaje <span class="text-danger">*</span>
              </label>
              <div class="form-floating">
                <textarea 
                  class="form-control edit-input" 
                  id="notification_message" 
                  name="notification_message"
                  placeholder="Mensaje de la notificación" 
                  style="height: 120px" 
                  maxlength="500"
                  required></textarea>
                <label for="notification_message">Mensaje de la Notificación</label>
              </div>
              <div class="form-text">
                Máximo 500 caracteres
                <span id="char-count" class="float-end text-muted">0/500</span>
              </div>
            </div>

            <!-- Botones -->
            <div class="text-end">
              <button type="reset" class="btn btn-outline-secondary me-2">
                <i class="fas fa-undo me-1"></i>Limpiar
              </button>
              <button type="submit" class="btn btn-primary">
                <i class="fas fa-paper-plane me-1"></i>Guardar Notificación
              </button>
            </div>
          </form>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-danger" data-bs-dismiss="modal">
            <i class="fas fa-times me-1"></i>Cerrar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Pantalla de carga -->
  <div id="loading-screen">
    <div class="spinner-border text-light spinner" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
    <p class="mt-3">Cargando datos, por favor espera...</p>
  </div>

  <!-- Scripts externos -->
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <script src="https://cdn.datatables.net/2.3.2/js/dataTables.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Scripts personalizados -->
  <script src="../../assets/js/app/constants.js"></script>
  <script src="../../assets/js/storage/appStorage.js"></script>
  <script src="../../assets/js/services/services.js"></script>
  <script src="../../assets/js/app/app.js"></script>
  <script src="../../assets/js/utils/Form.js"></script>
  <script src="../../assets/js/controllers/notification/notification.controller.js"></script>

  <!-- Script para contador de caracteres -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const messageTextarea = document.getElementById('notification_message');
      const charCount = document.getElementById('char-count');
      
      if (messageTextarea && charCount) {
        messageTextarea.addEventListener('input', function() {
          const currentLength = this.value.length;
          charCount.textContent = `${currentLength}/500`;
          
          // Cambiar color según el uso
          if (currentLength > 450) {
            charCount.classList.remove('text-muted', 'text-warning');
            charCount.classList.add('text-danger');
          } else if (currentLength > 400) {
            charCount.classList.remove('text-muted', 'text-danger');
            charCount.classList.add('text-warning');
          } else {
            charCount.classList.remove('text-warning', 'text-danger');
            charCount.classList.add('text-muted');
          }
        });
      }
    });
  </script>
</body>

</html>
