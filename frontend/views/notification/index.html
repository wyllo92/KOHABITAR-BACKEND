<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Notificaciones</title>
  <!-- Favicon -->
  <link rel="icon" href="../../assets/img/logos/logo.png" type="image/png">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome para iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Data table -->
  <link rel="stylesheet" href="https://cdn.datatables.net/2.3.2/css/dataTables.dataTables.css">
  <!-- Loading -->
  <link rel="stylesheet" href="../../assets/css/loading.css">
</head>

<body>
 
  <!--Container -->
  <div class="container-fluid d-flex flex-column min-vh-100">
   
    <!--Content data-->
    <main>
      <h1 class="text-center mb-4">Gestión de Notificaciones</h1>
      <button type="button" title="Agregar Notificación" class="btn btn-primary mb-3" onclick="add()">
        <i class="fa fa-bell me-1"></i>Agregar Notificación
      </button>

      <!--Table-->
      <div class="table-responsive">
        <table class="table table-dark table-hover" id="app-table">
          <thead>
            <tr class="table-primary text-center">
              <th>#</th>
              <th>Título</th>
              <th>Tipo</th>
              <th>Destinatario</th>
              <th>Estado</th>
              <th>Fecha</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="app-table-body" class="text-center">
          </tbody>
          <tfoot>
            <tr class="table-primary text-center">
              <td>#</td>
              <td>Título</td>
              <td>Tipo</td>
              <td>Destinatario</td>
              <td>Estado</td>
              <td>Fecha</td>
              <td>Acciones</td>
            </tr>
          </tfoot>
        </table>
      </div>

      <!-- Modal -->
      <div class="modal fade" id="appModal" tabindex="-1" aria-labelledby="appModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="appModalLabel">Notificación</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <!--Form-->
              <form id="notificationForm">
                <div class="row">
                  <!-- CAMPO TÍTULO OBLIGATORIO
                       carga del modelo Notification que requiere title como campo obligatorio -->
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="notification_title" class="form-label required">
                        <i class="fas fa-heading me-1"></i>Título *
                      </label>
                      <div class="form-floating">
                        <input type="text" class="form-control" placeholder="Título de la notificación" id="notification_title" name="notification_title" required value="">
                        <label for="notification_title">Ingrese el título de la notificación</label>
                      </div>
                    </div>
                  </div>
                  <!-- CAMPO TIPO DE NOTIFICACIÓN OBLIGATORIO
                       carga del modelo Notification que requiere notification_type_id
                       Se carga dinámicamente desde el endpoint /notification-types del backend -->
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="notification_type_id" class="form-label required">
                        <i class="fas fa-tags me-1"></i>Tipo de Notificación *
                      </label>
                      <select class="form-select" id="notification_type_id" name="notification_type_id" required>
                        <option value="" selected disabled>Selecciona el tipo</option>
                      </select>
                    </div>
                  </div>
                </div>
                <div class="row">
                  <!-- CAMPO USUARIO
                       El sistema ahora permite dos opciones:
                       1. Seleccionar un usuario específico para envío individual
                       2. Seleccionar "Todos los usuarios" para envío masivo
                       El backend detecta automáticamente el modo según el valor de user_id -->
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="user_id" class="form-label">
                        <i class="fas fa-user me-1"></i>Usuario Destinatario *
                      </label>
                      <select class="form-select" id="user_id" name="user_id" required>
                        <option value="" selected disabled>Selecciona el destinatario</option>
                        <!-- Opción especial para envío masivo a todos los usuarios activos -->
                        <option value="all" style="font-weight: bold; background-color: #e3f2fd;">
                          Todos los usuarios (Envío masivo)
                        </option>
                      </select>
                      <!-- Mensaje informativo para el usuario -->
                      <small class="form-text text-muted">
                        Selecciona un usuario específico o "Todos los usuarios" para envío masivo
                      </small>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="mb-3">
                      <!-- CAMPO PRIORIDAD
                           El backend espera priority como número (1=baja, 2=normal, 3=alta)
                           Se adapta el frontend para enviar los valores correctos -->
                      <label for="notification_priority" class="form-label">
                        <i class="fas fa-exclamation-triangle me-1"></i>Prioridad *
                      </label>
                      <select class="form-select" id="notification_priority" name="notification_priority" required>
                        <option value="" selected disabled>Selecciona la prioridad</option>
                        <option value="1">Baja (1)</option>
                        <option value="2">Normal (2)</option>
                        <option value="3">Alta (3)</option>
                        <option value="4">Urgente (4)</option>
                      </select>
                    </div>
                  </div>
                </div>
                <div class="row">
                  <!-- CAMPO PROPIEDAD OPCIONAL
                       Según el modelo Notification, property_id es opcional (puede ser null)
                       Se carga dinámicamente desde el endpoint /properties del backend -->
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="property_id" class="form-label">
                        <i class="fas fa-building me-1"></i>Propiedad Relacionada (Opcional)
                      </label>
                      <select class="form-select" id="property_id" name="property_id">
                        <option value="" selected>Sin propiedad asociada</option>
                      </select>
                    </div>
                  </div>
                  <!-- CAMPO ESTADO OBLIGATORIO
                       Según el modelo Notification, status_id es obligatorio
                       Se carga dinámicamente desde el endpoint /statuses del backend -->
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="status_id" class="form-label">
                        <i class="fas fa-check-circle me-1"></i>Estado *
                      </label>
                      <select class="form-select" id="status_id" name="status_id" required>
                        <option value="" selected disabled>Selecciona el estado</option>
                      </select>
                    </div>
                  </div>
                </div>
                <!-- CAMPO MENSAJE OBLIGATORIO
                     carga del modelo Notification que requiere message como campo obligatorio -->
                <div class="mb-3">
                  <label for="notification_message" class="form-label required">
                    <i class="fas fa-comment-dots me-1"></i>Mensaje *
                  </label>
                  <div class="form-floating">
                    <textarea class="form-control" placeholder="Mensaje de la notificación" id="notification_message" name="notification_message" style="height: 120px" required></textarea>
                    <label for="notification_message">Ingrese el contenido del mensaje</label>
                  </div>
                </div>
                <div class="mb-3">
                  <div class="btn-group" role="group" aria-label="Basic mixed styles example">
                    <button type="reset" class="btn btn-outline-secondary me-md-2">
                      <i class="fas fa-undo me-1"></i>Limpiar
                    </button>
                    <button type="submit" class="btn btn-outline-primary me-md-2">
                      <i class="fas fa-paper-plane me-1"></i>Enviar
                    </button>
                  </div>
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cerrar</button>
              </div>
            </div>
          </div>
        </div>
      </div>

    </main>
    <!--End Content data-->

  </div>
  <!--End Container -->
 

  <!--Loading -->
  <div id="loading-screen">
    <div class="spinner-border text-light spinner" role="status">
      <span class="visually-hidden">Loading ...</span>
    </div>
    <p class="mt-3">Cargando datos, por favor espera...</p>
  </div>
  <!--End Loading -->

  <!-- Bootstrap 5 JS Bundle con Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Data table -->
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <script src="https://cdn.datatables.net/2.3.2/js/dataTables.js"></script>
  <!-- JS personalizado -->
  <script src="../../assets/js/app/constants.js"></script>
  <script src="../../assets/js/storage/appStorage.js"></script>
  <script src="../../assets/js/services/services.js"></script> 
  <script src="../../assets/js/app/app.js"></script>
  <script src="../../assets/js/utils/Form.js"></script>
  <script src="../../assets/js/controllers/notification/notification.controller.js"></script>

</body>

</html>
