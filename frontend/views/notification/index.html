<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Notificaciones</title>
  <!-- Favicon -->
  <link rel="icon" href="../../assets/img/logos/logo.png" type="image/png">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome para iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Data table -->
  <link rel="stylesheet" href="https://cdn.datatables.net/2.3.2/css/dataTables.dataTables.css">
  <!-- Loading -->
  <link rel="stylesheet" href="../../assets/css/loading.css">
</head>

<body>
 
  <!--Container -->
  <div class="container-fluid d-flex flex-column min-vh-100">
   
    <!--Content data-->
    <main>
      <h1 class="text-center mb-4">Gestión de Notificaciones</h1>
      <button type="button" title="Agregar Notificación" class="btn btn-primary mb-3" onclick="add()">
        <i class="fa fa-bell me-1"></i>Agregar Notificación
      </button>

      <!--Table-->
      <div class="table-responsive">
        <table class="table table-secondary table-hover" id="app-table">
          <thead>
            <tr class="table-primary text-center">
              <th class="text-center">#</th>
              <th class="text-center">Título</th>
              <th class="text-center">Tipo</th>
              <th class="text-center">Destinatario</th>
              <th class="text-center">Estado</th>
              <th class="text-center">Fecha</th>
              <th class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody id="app-table-body" class="text-center">
          </tbody>
          <tfoot>
            <tr class="table-primary text-center">
              <td class="text-center">#</td>
              <td class="text-center">Título</td>
              <td class="text-center">Tipo</td>
              <td class="text-center">Destinatario</td>
              <td class="text-center">Estado</td>
              <td class="text-center">Fecha</td>
              <td class="text-center">Acciones</td>
            </tr>
          </tfoot>
        </table>
      </div>

      <!-- Modal -->
      <div class="modal fade" id="appModal" tabindex="-1" aria-labelledby="appModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="appModalLabel">Notificación</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <!--Form-->
              <form id="notificationForm">
                <div class="row">
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="notification_title" class="form-label required">Título</label>
                      <div class="form-floating">
                        <input type="text" class="form-control" placeholder="Título de la notificación" id="notification_title" name="notification_title" required value="">
                        <label for="notification_title">Título de la Notificación</label>
                      </div>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="notification_type_id" class="form-label required">Tipo de Notificación</label>
                      <select class="form-select" id="notification_type_id" name="notification_type_id" required>
                        <option value="" selected disabled>Selecciona el tipo</option>
                      </select>
                    </div>
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="user_id" class="form-label">Destinatario</label>
                      <select class="form-select" id="user_id" name="user_id">
                        <option value="" selected disabled>Selecciona el destinatario</option>
                      </select>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="notification_priority" class="form-label">Prioridad</label>
                      <div class="form-floating">
                        <select class="form-control" id="notification_priority" name="notification_priority">
                          <option value="" selected disabled>Selecciona la prioridad</option>
                          <option value="Baja">Baja</option>
                          <option value="Media">Media</option>
                          <option value="Alta">Alta</option>
                          <option value="Urgente">Urgente</option>
                        </select>
                        <label for="notification_priority">Prioridad</label>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="mb-3">
                  <label for="notification_message" class="form-label required">Mensaje</label>
                  <div class="form-floating">
                    <textarea class="form-control" placeholder="Mensaje de la notificación" id="notification_message" name="notification_message" style="height: 120px" required></textarea>
                    <label for="notification_message">Mensaje de la Notificación</label>
                  </div>
                </div>
                <div class="mb-3">
                  <div class="btn-group" role="group" aria-label="Basic mixed styles example">
                    <button type="reset" class="btn btn-outline-secondary me-md-2">
                      <i class="fas fa-undo me-1"></i>Limpiar
                    </button>
                    <button type="submit" class="btn btn-outline-primary me-md-2">
                      <i class="fas fa-paper-plane me-1"></i>Enviar
                    </button>
                  </div>
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cerrar</button>
              </div>
            </div>
          </div>
        </div>
      </div>

    </main>
    <!--End Content data-->

  </div>
  <!--End Container -->
 

  <!--Loading -->
  <div id="loading-screen">
    <div class="spinner-border text-light spinner" role="status">
      <span class="visually-hidden">Loading ...</span>
    </div>
    <p class="mt-3">Cargando datos, por favor espera...</p>
  </div>
  <!--End Loading -->

  <!-- Bootstrap 5 JS Bundle con Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Data table -->
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <script src="https://cdn.datatables.net/2.3.2/js/dataTables.js"></script>
  <!-- JS personalizado -->
  <script src="../../assets/js/app/constants.js"></script>
  <script src="../../assets/js/storage/appStorage.js"></script>
  <script src="../../assets/js/services/services.js"></script> 
  <script src="../../assets/js/app/app.js"></script>
  <script src="../../assets/js/utils/Form.js"></script>
  <script src="../../assets/js/controllers/notification/notification.controller.js"></script>

</body>

</html>
