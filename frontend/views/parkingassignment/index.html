<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asignaciones de Parqueo</title>
  <!-- Favicon -->
  <link rel="icon" href="../../assets/img/logos/logo.png" type="image/png">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome para iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Data table -->
  <link rel="stylesheet" href="https://cdn.datatables.net/2.3.2/css/dataTables.dataTables.css">
  <!-- Loading -->
  <link rel="stylesheet" href="../../assets/css/loading.css">
</head>

<body>

  <!--Container -->
  <div class="container-fluid d-flex flex-column min-vh-100">

    <!--Content data-->
    <main>
      <h1 class="text-center mb-4">Gestión de Asignaciones de Parqueo</h1>
      <button type="button" title="Nueva Asignación" class="btn btn-primary mb-3" onclick="add()">
        <i class="fa fa-plus-circle me-1"></i>Nueva Asignación
      </button>

      <!--Table-->
      <div class="table-responsive">
        <table class="table table-dark table-hover" id="app-table">
          <thead>
            <tr class="table-primary text-center">
              <th>#</th>
              <th>Espacio</th>
              <th>Usuario</th>
              <th>Vehículo</th>
              <th>Fecha Inicio</th>
              <th>Fecha Fin</th>
              <th>Monto</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="app-table-body" class="text-center">
          </tbody>
          <tfoot>
            <tr class="table-primary text-center">
              <td>#</td>
              <td>Espacio</td>
              <td>Usuario</td>
              <td>Vehículo</td>
              <td>Fecha Inicio</td>
              <td>Fecha Fin</td>
              <td>Monto</td>
              <td>Estado</td>
              <td>Acciones</td>
            </tr>
          </tfoot>
        </table>
      </div>

      <!-- Modal -->
      <div class="modal fade" id="appModal" tabindex="-1" aria-labelledby="appModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="appModalLabel">Asignación de Parqueo</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <!--Form-->
              <form id="parkingassignmentForm">
                <div class="row">
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="parking_slot_id" class="form-label required">Espacio de Parqueo</label>
                      <select class="form-select" id="parking_slot_id" name="parking_slot_id" required>
                        <option value="" selected disabled>Selecciona el espacio</option>
                      </select>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="user_id" class="form-label required">Usuario</label>
                      <select class="form-select" id="user_id" name="user_id" required>
                        <option value="" selected disabled>Selecciona el usuario</option>
                      </select>
                    </div>
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="vehicle_id" class="form-label">Vehículo</label>
                      <select class="form-select" id="vehicle_id" name="vehicle_id">
                        <option value="" selected disabled>Selecciona el vehículo (opcional)</option>
                      </select>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="status_id" class="form-label required">Estado</label>
                      <select class="form-select" id="status_id" name="status_id" required>
                        <option value="" selected disabled>Selecciona el estado</option>
                      </select>
                    </div>
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="start_time" class="form-label required">Fecha y Hora de Inicio</label>
                      <input type="datetime-local" class="form-control" id="start_time" name="start_time" required>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="end_time" class="form-label required">Fecha y Hora de Fin</label>
                      <input type="datetime-local" class="form-control" id="end_time" name="end_time" required>
                    </div>
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="total_amount" class="form-label">Monto Total</label>
                      <input type="number" class="form-control" id="total_amount" name="total_amount" step="0.01" min="0" placeholder="0.00">
                    </div>
                  </div>
                </div>
                <div class="mb-3">
                  <div class="btn-group" role="group" aria-label="Basic mixed styles example">
                    <button type="reset" class="btn btn-outline-secondary me-md-2">
                      <i class="fas fa-undo me-1"></i>Limpiar
                    </button>
                    <button type="submit" class="btn btn-outline-primary me-md-2">
                      <i class="fas fa-paper-plane me-1"></i>Enviar
                    </button>
                  </div>
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cerrar</button>
              </div>
            </div>
          </div>
        </div>
      </div>

    </main>
    <!--End Content data-->

  </div>
  <!--End Container -->

  <!--Loading -->
  <div id="loading-screen">
    <div class="spinner-border text-light spinner" role="status">
      <span class="visually-hidden">Loading ...</span>
    </div>
    <p class="mt-3">Cargando datos, por favor espera...</p>
  </div>
  <!--End Loading -->

  <!-- Bootstrap 5 JS Bundle con Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Data table -->
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <script src="https://cdn.datatables.net/2.3.2/js/dataTables.js"></script>
  <!-- JS personalizado -->
  <script src="../../assets/js/app/constants.js"></script>
  <script src="../../assets/js/storage/appStorage.js"></script>
  <script src="../../assets/js/services/services.js"></script>
  <script src="../../assets/js/app/app.js"></script>
  <script src="../../assets/js/utils/Form.js"></script>
  <script src="../../assets/js/controllers/parkingassignment/parkingassignment.controller.js"></script>

</body>

</html>
