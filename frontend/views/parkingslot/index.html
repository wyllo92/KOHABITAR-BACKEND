<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espacios de Parqueo</title>
  <!-- Favicon -->
  <link rel="icon" href="../../assets/img/logos/logo.png" type="image/png">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome para iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Data table -->
  <link rel="stylesheet" href="https://cdn.datatables.net/2.3.2/css/dataTables.dataTables.css">
  <!-- Loading -->
  <link rel="stylesheet" href="../../assets/css/loading.css">
</head>

<body>
 
  <!--Container -->
  <div class="container-fluid d-flex flex-column min-vh-100">
   
    <!--Content data-->
    <main>
      <h1 class="text-center mb-4">Gestión de Espacios de Parqueo</h1>
      <button type="button" title="Agregar Espacio de Parqueo" class="btn btn-primary mb-3" onclick="add()">
        <i class="fa fa-parking me-1"></i>Agregar Espacio de Parqueo
      </button>

      <!--Table-->
      <div class="table-responsive">
        <table class="table table-bordered table-hover bg-white shadow-sm text-center" id="app-table">
          <thead class="thead-dark">
            <tr class="table-secondary text-center">
              <th class="text-center">#</th>
              <th class="text-center">Código</th>
              <th class="text-center">Tipo de Zona</th>
              <th class="text-center">Propiedad</th>
              <th class="text-center">Estado</th>
              <th class="text-center">Disponibilidad</th>
              <th class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody id="app-table-body" class="text-center">
          </tbody>
          <tfoot>
            <tr class="table-secondary text-center">
              <td class="text-center">#</td>
              <td class="text-center">Código</td>
              <td class="text-center">Tipo de Zona</td>
              <td class="text-center">Propiedad</td>
              <td class="text-center">Estado</td>
              <td class="text-center">Disponibilidad</td>
              <td class="text-center">Acciones</td>
            </tr>
          </tfoot>
        </table>
      </div>

     <!-- Modal Espacio de Parqueo -->
<div class="modal fade" id="appModal" tabindex="-1" aria-labelledby="appModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg custom-modal">
    <div class="modal-content shadow-lg border-0 rounded-4">

      <div class="modal-header bg-primary text-white rounded-top-4">
        <h1 class="modal-title fs-5" id="appModalLabel">
          <i class="fas fa-parking me-2"></i>Espacio de Parqueo
        </h1>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <!--Form-->
        <form id="parkingslotForm">
          <div class="row">
            <!-- Código del espacio -->
            <div class="col-md-6">
              <div class="mb-3">
                <label for="code" class="form-label required">Código del Espacio</label>
                <div class="form-floating">
                  <input type="text" class="form-control" placeholder="Código del espacio" id="code" name="code" required>
                  <label for="code">Código del Espacio</label>
                </div>
              </div>
            </div>

            <!-- Zona de parqueo -->
            <div class="col-md-6">
              <div class="mb-3">
                <label for="parkingZone_id" class="form-label required">Zona de Parqueo</label>
                <div class="form-floating">
                  <select class="form-control" id="parkingZone_id" name="parkingZone_id" required>
                    <option value="" selected disabled>Selecciona la zona</option>
                  </select>
                  <label for="parkingZone_id">Zona de Parqueo</label>
                </div>
              </div>
            </div>
          </div>

          <div class="row">
            <!-- Estado de reserva -->
            <div class="col-md-6">
              <div class="mb-3">
                <label for="is_reserved" class="form-label">Estado de Reserva</label>
                <div class="form-floating">
                  <select class="form-control" id="is_reserved" name="is_reserved">
                    <option value="0" selected>Disponible</option>
                    <option value="1">Reservado</option>
                  </select>
                  <label for="is_reserved">Estado de Reserva</label>
                </div>
              </div>
            </div>

            <!-- Estado -->
            <div class="col-md-6">
              <div class="mb-3">
                <label for="status_id" class="form-label required">Estado</label>
                <div class="form-floating">
                  <select class="form-control" id="status_id" name="status_id" required>
                    <option value="1" selected>Activo</option>
                    <option value="2">Inactivo</option>
                  </select>
                  <label for="status_id">Estado</label>
                </div>
              </div>
            </div>
          </div>

          <!-- Botones -->
          <div class="col-12 d-flex justify-content-between mt-3">
            <button type="reset" class="btn btn-outline-secondary">
              <i class="bi bi-arrow-counterclockwise me-1"></i> Resetear
            </button>
            <button type="submit" class="btn btn-success ">
              <i class="bi bi-send-fill me-1"></i> Enviar
            </button>
            </div>
          </div>
        </form>
      </div>

    </main>
    <!--End Content data-->

  </div>
  <!--End Container -->
 

  <!--Loading -->
  <div id="loading-screen">
    <div class="spinner-border text-light spinner" role="status">
      <span class="visually-hidden">Loading ...</span>
    </div>
    <p class="mt-3">Cargando datos, por favor espera...</p>
  </div>
  <!--End Loading -->

  <!-- Bootstrap 5 JS Bundle con Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Data table -->
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <script src="https://cdn.datatables.net/2.3.2/js/dataTables.js"></script>
  <!-- JS personalizado -->
  <script src="../../assets/js/app/constants.js"></script>
  <script src="../../assets/js/storage/appStorage.js"></script>
  <script src="../../assets/js/services/services.js"></script> 
  <script src="../../assets/js/app/app.js"></script>
  <script src="../../assets/js/utils/Form.js"></script>
  <script src="../../assets/js/controllers/parkingslot/parkingslot.controller.js"></script>

</body>

</html>
