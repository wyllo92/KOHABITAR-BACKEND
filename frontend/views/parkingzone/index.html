<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Zonas de Parqueo</title>
  <!-- Favicon -->
  <link rel="icon" href="../../assets/img/logos/logo.png" type="image/png">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome para iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Data table -->
  <link rel="stylesheet" href="https://cdn.datatables.net/2.3.2/css/dataTables.dataTables.css">
  <!-- Loading -->
  <link rel="stylesheet" href="../../assets/css/loading.css">
</head>

<body>
 
  <!--Container -->
  <div class="container-fluid d-flex flex-column min-vh-100">
   
    <!--Content data-->
    <main>
      <h1 class="text-center mb-4">Gestión de Zonas de Parqueo</h1>
      <button type="button" title="Agregar Zona de Parqueo" class="btn btn-primary mb-3" onclick="add()">
        <i class="fa fa-map-marker-alt me-1"></i>Agregar Zona de Parqueo
      </button>

      <!--Table-->
      <div class="table-responsive">
        <table class="table table-dark table-hover" id="app-table">
          <thead>
            <tr class="table-primary text-center">
              <th>#</th>
              <th>Propiedad</th>
              <th>Tipo</th>
              <th>Capacidad</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="app-table-body" class="text-center">
          </tbody>
          <tfoot>
            <tr class="table-primary text-center">
              <td>#</td>
              <td>Propiedad</td>
              <td>Tipo</td>
              <td>Capacidad</td>
              <td>Estado</td>
              <td>Acciones</td>
            </tr>
          </tfoot>
        </table>
      </div>

      <!-- Modal -->
      <div class="modal fade" id="appModal" tabindex="-1" aria-labelledby="appModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="appModalLabel">Zona de Parqueo</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <!--Form-->
              <form id="parkingzoneForm">
                <div class="row">
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="parkingzone_name" class="form-label required">Nombre de la Zona</label>
                      <div class="form-floating">
                        <input type="text" class="form-control" placeholder="Nombre de la zona" id="parkingzone_name" name="parkingzone_name" required value="">
                        <label for="parkingzone_name">Nombre de la Zona</label>
                      </div>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="parkingzone_location" class="form-label required">Ubicación</label>
                      <div class="form-floating">
                        <input type="text" class="form-control" placeholder="Ubicación de la zona" id="parkingzone_location" name="parkingzone_location" required value="">
                        <label for="parkingzone_location">Ubicación de la Zona</label>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="parkingzone_capacity" class="form-label required">Capacidad</label>
                      <div class="form-floating">
                        <input type="number" class="form-control" placeholder="Capacidad de vehículos" id="parkingzone_capacity" name="parkingzone_capacity" required value="">
                        <label for="parkingzone_capacity">Capacidad de Vehículos</label>
                      </div>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="parkingzone_type" class="form-label">Tipo de Zona</label>
                      <div class="form-floating">
                        <select class="form-control" id="parkingzone_type" name="parkingzone_type">
                          <option value="" selected disabled>Selecciona el tipo</option>
                          <option value="General">General</option>
                          <option value="Residente">Residente</option>
                          <option value="Visitante">Visitante</option>
                          <option value="Discapacitados">Discapacitados</option>
                        </select>
                        <label for="parkingzone_type">Tipo de Zona</label>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="mb-3">
                  <label for="parkingzone_description" class="form-label">Descripción</label>
                  <div class="form-floating">
                    <textarea class="form-control" placeholder="Descripción de la zona" id="parkingzone_description" name="parkingzone_description" style="height: 100px"></textarea>
                    <label for="parkingzone_description">Descripción de la Zona</label>
                  </div>
                </div>
                <div class="mb-3">
                  <div class="btn-group" role="group" aria-label="Basic mixed styles example">
                    <button type="reset" class="btn btn-outline-secondary me-md-2">
                      <i class="fas fa-undo me-1"></i>Limpiar
                    </button>
                    <button type="submit" class="btn btn-outline-primary me-md-2">
                      <i class="fas fa-paper-plane me-1"></i>Enviar
                    </button>
                  </div>
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cerrar</button>
              </div>
            </div>
          </div>
        </div>
      </div>

    </main>
    <!--End Content data-->

  </div>
  <!--End Container -->
 

  <!--Loading -->
  <div id="loading-screen">
    <div class="spinner-border text-light spinner" role="status">
      <span class="visually-hidden">Loading ...</span>
    </div>
    <p class="mt-3">Cargando datos, por favor espera...</p>
  </div>
  <!--End Loading -->

  <!-- Bootstrap 5 JS Bundle con Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Data table -->
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <script src="https://cdn.datatables.net/2.3.2/js/dataTables.js"></script>
  <!-- JS personalizado -->
  <script src="../../assets/js/app/constants.js"></script>
  <script src="../../assets/js/storage/appStorage.js"></script>
  <script src="../../assets/js/services/services.js"></script> 
  <script src="../../assets/js/app/app.js"></script>
  <script src="../../assets/js/utils/Form.js"></script>
  <script src="../../assets/js/controllers/parkingzone/parkingzone.controller.js"></script>

</body>

</html>
