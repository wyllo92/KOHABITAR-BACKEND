<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagos</title>
  <!-- Favicon -->
  <link rel="icon" href="../../assets/img/logos/logo.png" type="image/png">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome para iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Data table -->
  <link rel="stylesheet" href="https://cdn.datatables.net/2.3.2/css/dataTables.dataTables.css">
  <!-- Loading -->
  <link rel="stylesheet" href="../../assets/css/loading.css">
</head>

<body>

  <div class="container-fluid d-flex flex-column min-vh-100">

    <main>
      <h1 class="text-center mb-4">Gestión de Pagos</h1>
      <button type="button" title="Agregar Pago" class="btn btn-primary mb-3" onclick="add()">
        <i class="fa fa-plus me-1"></i>Agregar Pago
      </button>

      <div class="table-responsive">
        <table class="table table-bordered table-hover bg-white shadow-sm text-center" id="app-table">
          <thead class="thead-dark">
            <tr class="table-secondary text-center">
              <th>#</th>
              <th>Usuario</th>
              <th>Monto</th>
              <th>Fecha</th>
              <th>Método</th>
              <th>Referencia</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="app-table-body" class="text-center">
          </tbody>
          <tfoot>
            <tr class="table-secondary text-center">
              <td>#</td>
              <td>Usuario</td>
              <td>Monto</td>
              <td>Fecha</td>
              <td>Método</td>
              <td>Referencia</td>
              <td>Acciones</td>
            </tr>
          </tfoot>
        </table>
      </div>

      <!-- Modal -->
      <div class="modal fade" id="appModal" tabindex="-1" aria-labelledby="appModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg custom-modal">
          <div class="modal-content shadow-lg border-0 rounded-4">

            <div class="modal-header bg-primary text-white rounded-top-4">
              <h1 class="modal-title fs-5 fw-bold" id="appModalLabel">Pago</h1>
              <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body p-4">
              <form id="paymentForm">
                <div class="row g-3">

                  <!-- Usuario (Requerido) -->
                  <div class="col-md-6">
                    <label for="user_id" class="form-label fw-semibold">
                      Usuario <span class="text-danger">*</span>
                    </label>
                    <select class="form-select" id="user_id" name="user_id" required>
                      <option value="" selected disabled>Seleccione un usuario</option>
                    </select>
                  </div>

                  <!-- Monto (Requerido) -->
                  <div class="col-md-6">
                    <label for="amount_paid" class="form-label fw-semibold">
                      Monto <span class="text-danger">*</span>
                    </label>
                    <div class="input-group">
                      <span class="input-group-text">$</span>
                      <input type="number" step="0.01" min="0.01" class="form-control" id="amount_paid" name="amount_paid" placeholder="0.00" required>
                    </div>
                    <small class="form-text text-muted">Debe ser mayor a 0</small>
                  </div>

                  <!-- Fecha de pago (Requerido) -->
                  <div class="col-md-6">
                    <label for="payment_date" class="form-label fw-semibold">
                      Fecha de pago <span class="text-danger">*</span>
                    </label>
                    <input type="datetime-local" class="form-control" id="payment_date" name="payment_date" required>
                  </div>

                  <!-- Método (Opcional) -->
                  <div class="col-md-6">
                    <label for="method" class="form-label fw-semibold">Método de pago</label>
                    <select class="form-select" id="method" name="method">
                      <option value="">Seleccione un método</option>
                      <option value="Efectivo">Efectivo</option>
                      <option value="Tarjeta de Crédito">Tarjeta de Crédito</option>
                      <option value="Tarjeta de Débito">Tarjeta de Débito</option>
                      <option value="Transferencia">Transferencia Bancaria</option>
                      <option value="PayPal">PayPal</option>
                      <option value="Otro">Otro</option>
                    </select>
                  </div>

                  <!-- Referencia (Opcional) -->
                  <div class="col-md-12">
                    <label for="reference" class="form-label fw-semibold">Referencia / Número de transacción</label>
                    <input type="text" class="form-control" id="reference" name="reference" placeholder="Ej: TRX123456789" maxlength="100">
                    <small class="form-text text-muted">Opcional: Ingrese el número de referencia o código de transacción</small>
                  </div>

                </div>

                <!-- Botones de acción -->
                <div class="col-12 d-flex justify-content-between mt-4">
                  <button type="reset" class="btn btn-outline-secondary">
                    <i class="fas fa-redo me-1"></i> Limpiar
                  </button>
                  <button type="submit" class="btn btn-success">
                    <i class="fas fa-save me-1"></i> Guardar
                  </button>
                </div>
              </form>
            </div>

          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="spinner-border text-light spinner" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
    <p class="mt-3">Cargando datos, por favor espera...</p>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <script src="https://cdn.datatables.net/2.3.2/js/dataTables.js"></script>
  <script src="../../assets/js/app/constants.js"></script>
  <script src="../../assets/js/storage/appStorage.js"></script>
  <script src="../../assets/js/services/services.js"></script>
  <script src="../../assets/js/app/app.js"></script>
  <script src="../../assets/js/utils/Form.js"></script>
  <script src="../../assets/js/controllers/payment/payment.controller.js"></script>

</body>

</html>
