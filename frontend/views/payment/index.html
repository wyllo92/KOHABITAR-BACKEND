<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagos</title>
  <!-- Favicon -->
  <link rel="icon" href="../../assets/img/logos/logo.png" type="image/png">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome para iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Data table -->
  <link rel="stylesheet" href="https://cdn.datatables.net/2.3.2/css/dataTables.dataTables.css">
  <!-- Loading -->
  <link rel="stylesheet" href="../../assets/css/loading.css">
</head>

<body>

  <div class="container-fluid d-flex flex-column min-vh-100">

    <main>
      <h1 class="text-center mb-4">Gestión de Pagos</h1>
      <button type="button" title="Agregar Pago" class="btn btn-primary mb-3" onclick="add()">
        <i class="fa fa-plus me-1"></i>Agregar Pago
      </button>

      <div class="table-responsive">
        <table class="table table-bordered table-hover bg-white shadow-sm text-center" id="app-table">
          <thead class="thead-dark">
            <tr class="table-secondary text-center">
              <th>#</th>
              <th>Usuario</th>
              <th>Monto</th>
              <th>Fecha</th>
              <th>Método</th>
              <th>Referencia</th>
              <th>Factura</th>
              <th>Reserva</th>
              <th>Cajón</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="app-table-body" class="text-center">
          </tbody>
          <tfoot>
            <tr class="table-secondary text-center">
              <td>#</td>
              <td>Usuario</td>
              <td>Monto</td>
              <td>Fecha</td>
              <td>Método</td>
              <td>Referencia</td>
              <td>Factura</td>
              <td>Reserva</td>
              <td>Cajón</td>
              <td>Estado</td>
              <td>Acciones</td>
            </tr>
          </tfoot>
        </table>
      </div>

      <!-- Modal -->
      <div class="modal fade" id="appModal" tabindex="-1" aria-labelledby="appModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg custom-modal">
          <div class="modal-content shadow-lg border-0 rounded-4">

            <div class="modal-header bg-primary text-white rounded-top-4">
              <h1 class="modal-title fs-5 fw-bold" id="appModalLabel">Pago</h1>
              <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body p-4">
              <form id="paymentForm">
                <div class="row g-3">

                  <div class="col-md-6">
                    <label for="user_id" class="form-label">Usuario</label>
                    <select class="form-select" id="user_id" name="user_id" required>
                      <option value="" selected disabled>Seleccione un usuario</option>
                    </select>
                  </div>

                  <div class="col-md-6">
                    <div class="form-floating">
                      <input type="number" step="0.01" class="form-control" id="amount_paid" name="amount_paid" placeholder="Monto" required>
                      <label for="amount_paid">Monto</label>
                    </div>
                  </div>

                  <div class="col-md-6">
                    <div class="form-floating">
                      <input type="datetime-local" class="form-control" id="payment_date" name="payment_date" placeholder="Fecha de pago" required>
                      <label for="payment_date">Fecha de pago</label>
                    </div>
                  </div>

                  <div class="col-md-6">
                    <div class="form-floating">
                      <input type="text" class="form-control" id="method" name="method" placeholder="Método">
                      <label for="method">Método</label>
                    </div>
                  </div>

                  <div class="col-md-6">
                    <div class="form-floating">
                      <input type="text" class="form-control" id="reference" name="reference" placeholder="Referencia">
                      <label for="reference">Referencia</label>
                    </div>
                  </div>

                  <div class="col-md-6">
                    <label for="invoice_id" class="form-label">Factura</label>
                    <select class="form-select" id="invoice_id" name="invoice_id">
                      <option value="" selected>Sin factura</option>
                    </select>
                  </div>

                  <div class="col-md-6">
                    <label for="reservation_id" class="form-label">Reserva</label>
                    <select class="form-select" id="reservation_id" name="reservation_id">
                      <option value="" selected>Sin reserva</option>
                    </select>
                  </div>

                  <div class="col-md-6">
                    <label for="parking_assignment_id" class="form-label">Cajón</label>
                    <select class="form-select" id="parking_assignment_id" name="parking_assignment_id">
                      <option value="" selected>Sin cajón</option>
                    </select>
                  </div>

                  <div class="col-md-6">
                    <label for="status_id" class="form-label">Estado</label>
                    <select class="form-select" id="status_id" name="status_id" required>
                      <option value="" selected disabled>Seleccione estado</option>
                    </select>
                  </div>

                </div>

                <div class="col-12 d-flex justify-content-between mt-3">
                  <button type="reset" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-counterclockwise me-1"></i> Resetear
                  </button>
                  <button type="submit" class="btn btn-success ">
                    <i class="bi bi-send-fill me-1"></i> Enviar
                  </button>
                </div>
              </form>
            </div>

          </div>
        </div>
      </div>

    </main>
  </div>

  <div id="loading-screen">
    <div class="spinner-border text-light spinner" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
    <p class="mt-3">Cargando datos, por favor espera...</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <script src="https://cdn.datatables.net/2.3.2/js/dataTables.js"></script>
  <script src="../../assets/js/app/constants.js"></script>
  <script src="../../assets/js/storage/appStorage.js"></script>
  <script src="../../assets/js/services/services.js"></script>
  <script src="../../assets/js/app/app.js"></script>
  <script src="../../assets/js/utils/Form.js"></script>
  <script src="../../assets/js/controllers/payment/payment.controller.js"></script>

</body>

</html>
