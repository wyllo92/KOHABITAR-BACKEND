<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Perfiles</title>
  <!-- Favicon -->
  <link rel="icon" href="../../assets/img/logos/logo.png" type="image/png">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome para iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Data table -->
  <link rel="stylesheet" href="https://cdn.datatables.net/2.3.2/css/dataTables.dataTables.css">
  <!-- Loading -->
  <link rel="stylesheet" href="../../assets/css/loading.css">
</head>

<body>
 
  <!--Container -->
  <div class="container-fluid d-flex flex-column min-vh-100">
  
    <!--Content data-->
    <main>
      <h1 class="text-center mb-4">Gestión de Perfiles</h1>
      <button type="button" title="Agregar Perfil" class="btn btn-primary mb-3" onclick="add()">
        <i class="fa fa-address-card me-1"></i>Agregar Perfil
      </button>

      <!--Table-->
      <div class="table-responsive">
        <table class="table table-dark table-hover" id="app-table">
          <thead>
            <tr class="table-primary text-center">
              <th>#</th>
              <th>Usuario</th>
              <th>Nombre Completo</th>
              <th>Teléfono</th>
              <th>Email</th>
              <th>Dirección</th>
              <th>Rol</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="app-table-body" class="text-center">
          </tbody>
          <tfoot>
            <tr class="table-primary text-center">
              <td>#</td>
              <td>Usuario</td>
              <td>Nombre Completo</td>
              <td>Teléfono</td>
              <td>Email</td>
              <td>Dirección</td>
              <td>Rol</td>
              <td>Estado</td>
              <td>Acciones</td>
            </tr>
          </tfoot>
        </table>
      </div>

      <!-- Modal -->
      <div class="modal fade" id="appModal" tabindex="-1" aria-labelledby="appModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="appModalLabel">Perfil de Usuario</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <!--Form-->
              <form id="profileForm">
                <div class="row">
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="user_id" class="form-label required">Usuario</label>
                      <select class="form-select" id="user_id" name="user_id" required>
                        <option value="" selected disabled>Selecciona un usuario</option>
                      </select>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="profile_fullName" class="form-label required">Nombre Completo</label>
                      <div class="form-floating">
                        <input type="text" class="form-control" placeholder="Nombre completo" id="profile_fullName" name="profile_fullName" required value="">
                        <label for="profile_fullName">Nombre Completo</label>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="profile_phone" class="form-label required">Teléfono</label>
                      <div class="form-floating">
                        <input type="text" class="form-control" placeholder="Teléfono" id="profile_phone" name="profile_phone" required value="">
                        <label for="profile_phone">Teléfono</label>
                      </div>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="profile_email" class="form-label required">Email</label>
                      <div class="form-floating">
                        <input type="email" class="form-control" placeholder="Email" id="profile_email" name="profile_email" required value="">
                        <label for="profile_email">Email</label>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="mb-3">
                  <label for="profile_address" class="form-label">Dirección</label>
                  <div class="form-floating">
                    <textarea class="form-control" placeholder="Dirección" id="profile_address" name="profile_address" style="height: 80px"></textarea>
                    <label for="profile_address">Dirección</label>
                  </div>
                </div>
                <div class="mb-3">
                  <label for="profile_photo" class="form-label">Foto de Perfil</label>
                  <div class="form-floating">
                    <input type="text" class="form-control edit-input" placeholder="URL de la foto" id="profile_photo" name="profile_photo" value="">
                    <label for="profile_photo">URL de la Foto</label>
                  </div>
                </div>
                <div class="mb-3">
                  <div class="btn-group" role="group" aria-label="Basic mixed styles example">
                    <button type="reset" class="btn btn-outline-secondary me-md-2">
                      <i class="fas fa-undo me-1"></i>Limpiar
                    </button>
                    <button type="submit" class="btn btn-outline-primary me-md-2">
                      <i class="fas fa-paper-plane me-1"></i>Enviar
                    </button>
                  </div>
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cerrar</button>
              </div>
            </div>
          </div>
        </div>
      </div>

    </main>
    <!--End Content data-->

  </div>
  <!--End Container -->

  <!--Loading -->
  <div id="loading-screen">
    <div class="spinner-border text-light spinner" role="status">
      <span class="visually-hidden">Loading ...</span>
    </div>
    <p class="mt-3">Cargando datos, por favor espera...</p>
  </div>
  <!--End Loading -->

  <!-- Bootstrap 5 JS Bundle con Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Data table -->
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <script src="https://cdn.datatables.net/2.3.2/js/dataTables.js"></script>
  <!-- JS personalizado -->
  <script src="../../assets/js/app/constants.js"></script>
  <script src="../../assets/js/storage/appStorage.js"></script>
  <script src="../../assets/js/services/services.js"></script>
  <script src="../../assets/js/app/app.js"></script>
  <script src="../../assets/js/utils/Form.js"></script>
  <script src="../../assets/js/controllers/profile/profile.controller.js"></script>

</body>

</html>
