<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes y Estadísticas</title>
  <!-- Favicon -->
  <link rel="icon" href="../../assets/img/logos/logo.png" type="image/png">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome para iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Data table -->
  <link rel="stylesheet" href="https://cdn.datatables.net/2.3.2/css/dataTables.dataTables.css">
  <!-- Loading -->
  <link rel="stylesheet" href="../../assets/css/loading.css">
  <style>
    .stat-card { min-width: 180px; }
    .chart-container { min-height: 320px; }
  </style>
</head>

<body>
 
  <!--Container -->
  <div class="container-fluid d-flex flex-column min-vh-100">
   
    <!--Content data-->
    <main>
      <h1 class="text-center mb-4">Reportes y Estadísticas</h1>
      
      <!-- Estadísticas rápidas -->
      <div class="row mb-4 g-3 justify-content-center" id="stats-row">
        <div class="col-auto">
          <div class="card stat-card text-bg-primary text-center">
            <div class="card-body">
              <h5 class="card-title">Total Reportes</h5>
              <h2 id="stat-total">0</h2>
            </div>
          </div>
        </div>
        <div class="col-auto">
          <div class="card stat-card text-bg-success text-center">
            <div class="card-body">
              <h5 class="card-title">Usuarios</h5>
              <h2 id="stat-activos">0</h2>
            </div>
          </div>
        </div>
        <div class="col-auto">
          <div class="card stat-card text-bg-danger text-center">
            <div class="card-body">
              <h5 class="card-title">Propiedades</h5>
              <h2 id="stat-pendientes">0</h2>
            </div>
          </div>
        </div>
        <div class="col-auto">
          <div class="card stat-card text-bg-secondary text-center">
            <div class="card-body">
              <h5 class="card-title">Vehículos</h5>
              <h2 id="stat-cerrados">0</h2>
            </div>
          </div>
        </div>
        <div class="col-auto">
          <div class="card stat-card text-bg-info text-center">
            <div class="card-body">
              <h5 class="card-title">Reservas</h5>
              <h2 id="stat-reservas">0</h2>
            </div>
          </div>
        </div>
      </div>

      <!-- Filtros -->
      <div class="row mb-4 g-3 align-items-end" id="filters-row">
        <div class="col-md-3">
          <label for="filter-type" class="form-label">Tipo de Reporte</label>
          <select id="filter-type" class="form-select">
            <option value="">Todos</option>
          </select>
        </div>
        <div class="col-md-3">
          <label for="filter-status" class="form-label">Estado</label>
          <select id="filter-status" class="form-select">
            <option value="">Todos</option>
          </select>
        </div>
        <div class="col-md-3">
          <label for="filter-user" class="form-label">Usuario</label>
          <select id="filter-user" class="form-select">
            <option value="">Todos</option>
          </select>
        </div>
        <div class="col-md-3">
          <label for="filter-date" class="form-label">Fecha</label>
          <input type="date" id="filter-date" class="form-control">
        </div>
      </div>

      <!-- Gráficos -->
      <div class="row mb-4">
        <div class="col-md-6">
          <div class="card">
            <div class="card-header">Reportes por Tipo</div>
            <div class="card-body chart-container">
              <canvas id="chart-tipo"></canvas>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card">
            <div class="card-header">Reportes por Estado</div>
            <div class="card-body chart-container">
              <canvas id="chart-estado"></canvas>
            </div>
          </div>
        </div>
      </div>

      <!-- Tabla de Reportes -->
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h5 class="mb-0">Lista de Reportes</h5>
          <button type="button" class="btn btn-primary" onclick="add()">
            <i class="fas fa-plus me-2"></i>Nuevo Reporte
          </button>
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table id="app-table" class="table table-striped table-hover">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Título</th>
                  <th>Tipo</th>
                  <th>Usuario</th>
                  <th>Estado</th>
                  <th>Fecha</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="app-table-body">
                <!-- Los datos se cargarán dinámicamente -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Modal -->
      <div class="modal fade" id="appModal" tabindex="-1" aria-labelledby="appModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="appModalLabel">Detalle del Reporte</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <div id="report-details">
                <!-- Los detalles del reporte se mostrarán aquí -->
              </div>
            </div>
            <div class="modal-footer">
              <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cerrar</button>
              </div>
            </div>
          </div>
        </div>
      </div>

    </main>
    <!--End Content data-->

  </div>
  <!--End Container -->
 

  <!--Loading -->
  <div id="loading-screen">
    <div class="spinner-border text-light spinner" role="status">
      <span class="visually-hidden">Loading ...</span>
    </div>
    <p class="mt-3">Cargando datos, por favor espera...</p>
  </div>
  <!--End Loading -->

  <!-- Bootstrap 5 JS Bundle con Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Data table -->
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <script src="https://cdn.datatables.net/2.3.2/js/dataTables.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- JS personalizado -->
  <script src="../../assets/js/app/constants.js"></script>
  <script src="../../assets/js/storage/appStorage.js"></script>
  <script src="../../assets/js/services/services.js"></script> 
  <script src="../../assets/js/app/app.js"></script>
  <script src="../../assets/js/utils/Form.js"></script>
  <script src="../../assets/js/controllers/report/report.controller.js"></script>

</body>

</html>
