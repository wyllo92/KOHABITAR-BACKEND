<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Reportes</title>
  <!-- Favicon -->
  <link rel="icon" href="../../assets/img/logos/logo.png" type="image/png">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome para iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Data table -->
  <link rel="stylesheet" href="https://cdn.datatables.net/2.3.2/css/dataTables.dataTables.css">
  <!-- Loading -->
  <link rel="stylesheet" href="../../assets/css/loading.css">
</head>

<body>
 
  <!--Container -->
  <div class="container-fluid d-flex flex-column min-vh-100">
   
    <!--Content data-->
    <main>
      <h1 class="text-center mb-4">Gestión de Reportes</h1>
      <button type="button" title="Agregar Reporte" class="btn btn-primary mb-3" onclick="add()">
        <i class="fa fa-file-alt me-1"></i>Agregar Reporte
      </button>

      <!--Table-->
      <div class="table-responsive">
        <table class="table table-dark table-hover" id="app-table">
          <thead>
            <tr class="table-primary text-center">
              <th>#</th>
              <th>Título</th>
              <th>Tipo</th>
              <th>Reportado por</th>
              <th>Estado</th>
              <th>Fecha</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="app-table-body" class="text-center">
          </tbody>
          <tfoot>
            <tr class="table-primary text-center">
              <td>#</td>
              <td>Título</td>
              <td>Tipo</td>
              <td>Reportado por</td>
              <td>Estado</td>
              <td>Fecha</td>
              <td>Acciones</td>
            </tr>
          </tfoot>
        </table>
      </div>

      <!-- Modal -->
      <div class="modal fade" id="appModal" tabindex="-1" aria-labelledby="appModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="appModalLabel">Reporte</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <form id="reportForm">
                <div class="row">
                  <!-- CAMPO USUARIO OBLIGATORIO
                       carga del modelo Report que requiere user_id como campo obligatorio
                       Se carga dinámicamente desde el endpoint /user del backend -->
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="user_id" class="form-label required">
                        <i class="fas fa-user me-1"></i>Usuario *
                      </label>
                      <select class="form-select" id="user_id" name="user_id" required>
                        <option value="" selected disabled>Selecciona el usuario</option>
                      </select>
                    </div>
                  </div>
                  <!-- CAMPO TIPO DE REPORTE OBLIGATORIO
                       carga del modelo Report que requiere report_type_id
                       Se carga dinámicamente desde el endpoint /reportType del backend -->
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="report_type_id" class="form-label required">
                        <i class="fas fa-tags me-1"></i>Tipo de Reporte *
                      </label>
                      <select class="form-select" id="report_type_id" name="report_type_id" required>
                        <option value="" selected disabled>Selecciona el tipo</option>
                      </select>
                    </div>
                  </div>
                </div>
                <div class="row">
                  <!-- CAMPO TÍTULO OBLIGATORIO
                       carga del modelo Report que requiere title como campo obligatorio -->
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="title" class="form-label required">
                        <i class="fas fa-heading me-1"></i>Título *
                      </label>
                      <div class="form-floating">
                        <input type="text" class="form-control" placeholder="Título del reporte" id="title" name="title" required value="">
                        <label for="title">Ingrese el título del reporte</label>
                      </div>
                    </div>
                  </div>
                  <!-- CAMPO ESTADO OBLIGATORIO
                       carga del modelo Report que requiere status_id
                       Se carga dinámicamente desde el endpoint /statuses del backend -->
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="status_id" class="form-label required">
                        <i class="fas fa-check-circle me-1"></i>Estado *
                      </label>
                      <select class="form-select" id="status_id" name="status_id" required>
                        <option value="" selected disabled>Selecciona el estado</option>
                      </select>
                    </div>
                  </div>
                </div>
                <div class="row">
                  <!-- CAMPO URL DE ARCHIVO OPCIONAL
                       carga del modelo Report donde file_url es opcional -->
                  <div class="col-md-12">
                    <div class="mb-3">
                      <label for="file_url" class="form-label">
                        <i class="fas fa-paperclip me-1"></i>URL del Archivo (Opcional)
                      </label>
                      <div class="form-floating">
                        <input type="url" class="form-control" placeholder="https://ejemplo.com/archivo.pdf" id="file_url" name="file_url" value="">
                        <label for="file_url">Ingrese la URL del archivo adjunto</label>
                      </div>
                    </div>
                  </div>
                </div>
                <!-- CAMPO DESCRIPCIÓN OBLIGATORIO
                     carga del modelo Report que requiere description como campo obligatorio -->
                <div class="mb-3">
                  <label for="description" class="form-label required">
                    <i class="fas fa-comment-dots me-1"></i>Descripción *
                  </label>
                  <div class="form-floating">
                    <textarea class="form-control" placeholder="Descripción detallada del reporte" id="description" name="description" style="height: 120px" required></textarea>
                    <label for="description">Descripción Detallada del Reporte</label>
                  </div>
                </div>
                
                <!-- BOTONES DE ACCIÓN DEL FORMULARIO
                     Mantiene funcionalidad estándar de limpiar y enviar -->
                <div class="mb-3">
                  <div class="btn-group w-100" role="group" aria-label="Acciones del formulario">
                    <button type="reset" class="btn btn-outline-secondary">
                      <i class="fas fa-undo me-1"></i>Limpiar Formulario
                    </button>
                    <button type="submit" class="btn btn-primary">
                      <i class="fas fa-paper-plane me-1"></i>Guardar Reporte
                    </button>
                  </div>
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cerrar</button>
              </div>
            </div>
          </div>
        </div>
      </div>

    </main>
    <!--End Content data-->

  </div>
  <!--End Container -->
 

  <!--Loading -->
  <div id="loading-screen">
    <div class="spinner-border text-light spinner" role="status">
      <span class="visually-hidden">Loading ...</span>
    </div>
    <p class="mt-3">Cargando datos, por favor espera...</p>
  </div>
  <!--End Loading -->

  <!-- Bootstrap 5 JS Bundle con Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Data table -->
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <script src="https://cdn.datatables.net/2.3.2/js/dataTables.js"></script>
  <!-- JS personalizado -->
  <script src="../../assets/js/app/constants.js"></script>
  <script src="../../assets/js/storage/appStorage.js"></script>
  <script src="../../assets/js/services/services.js"></script> 
  <script src="../../assets/js/app/app.js"></script>
  <script src="../../assets/js/utils/Form.js"></script>
  <script src="../../assets/js/controllers/report/report.controller.js"></script>

</body>

</html>
