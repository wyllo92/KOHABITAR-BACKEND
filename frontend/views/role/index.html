<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roles</title>

  <!-- Favicon -->
  <link rel="icon" href="../../assets//img/logos/logo.png" type="image/png">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome para iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Data table -->
  <link rel="stylesheet" href="https://cdn.datatables.net/2.3.2/css/dataTables.dataTables.css">
  <!-- Loading -->
  <link rel="stylesheet" href="../../assets/css/loading.css">
</head>

<body>

  <!--Container -->
  <div class="container-fluid d-flex flex-column min-vh-100">

    <!--Content data-->
    <main>
      <h1 class="text-center">Formulario de Roles</h1>
      <button type="button" title="Add Role" class="btn btn-primary" onclick="add()"> <i
          class="fa fa-user-tag me-1"></i>Agregar Rol</button>

      <!--Table-->
      <div class="table-responsive">
        <table class="table table-bordered table-hover bg-white shadow-sm text-center" id="app-table">
          <thead class="thead-dark">
            <tr class="table-secondary text-center">
              <th>#</th>
              <th>Nombre del Rol</th>
              <th>Descripción</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="app-table-body" class="text-center">

          </tbody>
          <tfoot>
            <tr class="table-secondary text-center">
              <td>#</td>
              <td>Nombre del Rol</td>
              <td>Descripción</td>
              <td>Estado</td>
              <td>Acciones</td>
            </tr>
          </tfoot>
        </table>
      </div>

      <!-- Modal -->
      <div class="modal fade" id="appModal" tabindex="-1" aria-labelledby="appModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg custom-modal">
    <div class="modal-content shadow-lg border-0 rounded-4">

      <!-- Header -->
    <div class="modal-header bg-primary text-white rounded-top-4">
        <h1 class="modal-title fs-5 fw-bold" id="appModalLabel">Rol</h1>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <!-- Body -->
      <div class="modal-body p-4">
        <form id="roleForm" class="g-3">

          <!-- Nombre del Rol -->
          <div class="mb-3">
            <label for="role_name" class="form-label required">Nombre del Rol</label>
            <div class="form-floating">
              <input type="text" class="form-control" placeholder="Nombre del Rol" id="role_name" name="role_name" required>
              <label for="role_name">Nombre del Rol</label>
            </div>
          </div>

          <!-- Descripción -->
          <div class="mb-3">
            <label for="role_description" class="form-label">Descripción</label>
            <div class="form-floating">
              <textarea class="form-control" placeholder="Descripción del rol" id="role_description" name="role_description" style="height: 100px" required></textarea>
              <label for="role_description">Descripción</label>
            </div>
          </div>

          <!-- Estado -->
          <div class="mb-3">
            <label for="status_id" class="form-label required">Seleccionar Estado</label>
            <div class="form-floating">
              <select class="form-select" id="status_id" name="status_id" required>
                <option value="" disabled selected>Selecciona un estado</option>
                <!-- Aquí se cargan dinámicamente los estados -->
              </select>
              <label for="status_id">Estado</label>
            </div>
          </div>

          <!-- Botones -->
           <!-- Botones -->
          <div class="col-12 d-flex justify-content-between mt-3">
            <button type="reset" class="btn btn-outline-secondary">
              <i class="bi bi-arrow-counterclockwise me-1"></i> Resetear
            </button>
            <button type="submit" class="btn btn-success ">
              <i class="bi bi-send-fill me-1"></i> Enviar
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

    </main>
    <!--End Content data-->

  </div>
  <!--End Container -->


  <!--Loading -->
  <div id="loading-screen">
    <div class="spinner-border text-light spinner" role="status">
      <span class="visually-hidden">Loading ...</span>
    </div>
    <p class="mt-3">Data loading, please wait...</p>
  </div>
  <!--End Loading -->

  <!-- Bootstrap 5 JS Bundle con Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Data table -->
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <script src="https://cdn.datatables.net/2.3.2/js/dataTables.js"></script>
  <!-- JS personalizado -->
  <script src="../../assets/js/app/constants.js"></script>
  <script src="../../assets/js/storage/appStorage.js"></script>
  <script src="../../assets/js/services/services.js"></script>
  <script src="../../assets/js/app/app.js"></script>
  <script src="../../assets/js/utils/Form.js"></script>

  <script src="../../assets/js/controllers/role/role.controller.js"></script>

</body>

</html>
