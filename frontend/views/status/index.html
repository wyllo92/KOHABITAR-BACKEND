<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estados</title>
  <!-- Favicon -->
  <link rel="icon" href="../../assets/img/logos/logo.png" type="image/png">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome para iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Data table -->
  <link rel="stylesheet" href="https://cdn.datatables.net/2.3.2/css/dataTables.dataTables.css">
  <!-- Loading -->
  <link rel="stylesheet" href="../../assets/css/loading.css">
</head>

<body>

  <!--Container -->
  <div class="container-fluid d-flex flex-column min-vh-100">

    <!--Content data-->
    <main>
      <h1 class="text-center mb-4">Gestión de Estados</h1>
      <button type="button" title="Agregar Estado" class="btn btn-primary mb-3" onclick="add()">
        <i class="fa fa-plus me-1"></i>Agregar Estado
      </button>

      <!--Table-->
      <div class="table-responsive">
        <table class="table table-bordered table-hover bg-white shadow-sm text-center" id="app-table">
          <thead class="thead-dark">
            <tr class="table-secondary text-center">
              <th>#</th>
              <th>Nombre</th>
              <th>Descripción</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="app-table-body" class="text-center">
          </tbody>
          <tfoot>
            <tr class="table-secondary text-center">
              <td>#</td>
              <td>Nombre</td>
              <td>Descripción</td>
              <td>Estado</td>
              <td>Acciones</td>
            </tr>
          </tfoot>
        </table>
      </div>

      <!-- Modal -->
 <!-- Modal Estados -->
<div class="modal fade" id="appModal" tabindex="-1" aria-labelledby="appModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg custom-modal">
    <div class="modal-content shadow-lg border-0 rounded-4">

      <!-- Header -->
      <div class="modal-header bg-primary text-white rounded-top-4">
        <h1 class="modal-title fs-5 fw-bold" id="appModalLabel">Estado</h1></h1>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <!-- Body -->
      <div class="modal-body p-4">
        <form id="statusForm" class="g-3">

          <div class="row">
            <!-- Nombre -->
            <div class="col-md-6">
              <div class="mb-3">
                <label for="status_name" class="form-label required">Nombre del Estado</label>
                <div class="form-floating">
                  <input type="text" class="form-control" placeholder="Nombre del estado" id="status_name" name="status_name" required>
                  <label for="status_name">Nombre del Estado</label>
                </div>
              </div>
            </div>

            <!-- Entidad -->
            <div class="col-md-6">
              <div class="mb-3">
                <label for="status_entity" class="form-label required">Entidad</label>
                <div class="form-floating">
                  <select class="form-control" id="status_entity" name="status_entity" required>
                    <option value="" disabled selected>Selecciona la entidad</option>
                    <option value="user">Usuario</option>
                    <option value="property">Propiedad</option>
                    <option value="vehicle">Vehículo</option>
                    <option value="reservation">Reserva</option>
                    <option value="payment">Pago</option>
                    <option value="general">General</option>
                  </select>
                  <label for="status_entity">Entidad</label>
                </div>
              </div>
            </div>
          </div>

          <!-- Descripción -->
          <div class="mb-3">
            <label for="status_description" class="form-label">Descripción</label>
            <div class="form-floating">
              <textarea class="form-control" placeholder="Descripción del estado" id="status_description" name="status_description" style="height: 100px"></textarea>
              <label for="status_description">Descripción del Estado</label>
            </div>
          </div>

          <!-- Estado Activo -->
          <div class="mb-3">
            <label for="status_is_active" class="form-label">Estado Activo</label>
            <div class="form-floating">
              <select class="form-control" id="status_is_active" name="status_is_active" required>
                <option value="1" selected>Activo</option>
                <option value="0">Inactivo</option>
              </select>
              <label for="status_is_active">Estado Activo</label>
            </div>
          </div>

             <!-- Botones -->
          <div class="col-12 d-flex justify-content-between mt-3">
            <button type="reset" class="btn btn-outline-secondary">
              <i class="bi bi-arrow-counterclockwise me-1"></i> Resetear
            </button>
            <button type="submit" class="btn btn-success ">
              <i class="bi bi-send-fill me-1"></i> Enviar
            </button>
          </div>
        </form>
      </div>


<!-- CSS extra opcional para que el modal quede más arriba -->
<style>
  #appModal .modal-dialog {
    margin-top: 6vh;
  }
</style>

    </main>
    <!--End Content data-->

  </div>
  <!--End Container -->


  <!--Loading -->
  <div id="loading-screen">
    <div class="spinner-border text-light spinner" role="status">
      <span class="visually-hidden">Loading ...</span>
    </div>
    <p class="mt-3">Cargando datos, por favor espera...</p>
  </div>
  <!--End Loading -->

  <!-- Bootstrap 5 JS Bundle con Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Data table -->
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <script src="https://cdn.datatables.net/2.3.2/js/dataTables.js"></script>
  <!-- JS personalizado -->
  <script src="../../assets/js/app/constants.js"></script>
  <script src="../../assets/js/storage/appStorage.js"></script>
  <script src="../../assets/js/services/services.js"></script>
  <script src="../../assets/js/app/app.js"></script>
  <script src="../../assets/js/utils/Form.js"></script>
  <script src="../../assets/js/controllers/status/status.controller.js"></script>

</body>

</html>
