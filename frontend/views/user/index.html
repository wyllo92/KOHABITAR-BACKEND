<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios</title>
  <!-- Favicon -->
  <link rel="icon" href="../../assets//img/logos/logo.png" type="image/png">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome para iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Data table -->
  <link rel="stylesheet" href="https://cdn.datatables.net/2.3.2/css/dataTables.dataTables.css">
  <!-- SweetAlert2 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <!-- Loading -->
  <link rel="stylesheet" href="../../assets/css/loading.css">
</head>

<body>

  <!--Container -->
  <div class="container-fluid">

    <!--Content data-->
    <main>
      <h1 class="text-center">Gestion de Usuarios</h1>
      <button type="button" title="Add User" class="btn btn-primary" onclick="add()"> <i
          class="fa fa-user-plus me-1"></i> Agregar Usuario</button>

      <!--Table-->
      <div class="table-responsive">
  <table class="table table-bordered table-hover bg-white shadow-sm text-center" id="app-table">
    
    <!-- Encabezado -->
    <thead class="thead-dark">
      <tr class="table-secondary text-center">
        <th class="text-center">#</th>
        <th class="text-center">Nombre de Usuario</th>
        <th class="text-center">Rol</th>
        <th class="text-center">Estado</th>
        <th class="text-center">Acciones</th>
      </tr>
    </thead>

    <!-- Cuerpo -->
    <tbody id="app-table-body" class="text-center">
      <tr>
        <td class="text-center"></td>
        <td class="text-center"></td>
        <td class="text-center"></td>
        <td class="text-center"></td>
        <td class="text-center"></td>
      </tr>
    </tbody>

    <!-- Pie -->
    <tfoot>
      <tr class="table-secondary text-center">
        <td class="text-center">#</td>
        <td class="text-center">Nombre de Usuario</td>
        <td class="text-center">Rol</td>
        <td class="text-center">Estado</td>
        <td class="text-center">Acciones</td>
      </tr>
    </tfoot>

  </table>
</div>


      <!-- Modal -->
      <div class="modal fade" id="appModal" tabindex="-1" aria-labelledby="appModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg" style="margin-top: 2rem;">
          <div class="modal-content shadow-lg border-0 rounded-4">

            <!-- Header -->
            <div class="modal-header bg-primary text-white rounded-top-4">
              <h5 class="modal-title d-flex align-items-center" id="appModalLabel">
                <i class="bi bi-person-plus me-2"></i> Usuario
              </h5>
              <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                aria-label="Close"></button>
            </div>

            <!-- Body -->
            <div class="modal-body">
              <form id="userForm" class="row g-3">

                <!-- Usuario -->
                <div class="col-md-6">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="user_name" name="user_name"
                      placeholder="Nombre de Usuario" required>
                    <label for="user_name">Nombre de Usuario</label>
                  </div>
                </div>

                <!-- Contraseña -->
                <div class="col-md-6">
                  <div class="form-floating">
                    <input type="password" class="form-control" id="user_password" name="user_password"
                      placeholder="Contraseña" required>
                    <label for="user_password">Contraseña</label>
                  </div>
                </div>

                <!-- Rol -->
                <div class="col-md-6">
                  <label for="role_id" class="form-label fw-semibold">Seleccionar Rol</label>
                  <select class="form-select" id="role_id" name="role_id" required>
                    <option value="">-- Seleccione --</option>
                  </select>
                </div>

                <!-- Estado -->
                <div class="col-md-6">
                  <label for="status_id" class="form-label fw-semibold">Seleccionar Estado</label>
                  <select class="form-select" id="status_id" name="status_id" required>
                    <option value="">-- Seleccione --</option>
                  </select>
                </div>

                <!-- Botones -->
                <div class="col-12 d-flex justify-content-between mt-3">
                  <button type="reset" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-counterclockwise me-1"></i> Resetear
                  </button>
                  <button type="submit" class="btn btn-success">
                    <i class="bi bi-send-fill me-1"></i> Enviar
                  </button>
                </div>

              </form>
            </div>

          </div>
        </div>
      </div>
  </div>


  </main>
  <!--End Content data-->

  </div>
  <!--End Container -->


  <!--Loading -->
  <div id="loading-screen">
    <div class="spinner-border text-light spinner" role="status">
      <span class="visually-hidden">Loading ...</span>
    </div>
    <p class="mt-3">Data loading, please wait...</p>
  </div>
  <!--End Loading -->

  <!-- Bootstrap 5 JS Bundle con Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- SweetAlert2 JS -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Data table -->
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <script src="https://cdn.datatables.net/2.3.2/js/dataTables.js"></script>
  <!-- JS personalizado -->
  <script src="../../assets/js/app/constants.js"></script>
  <script src="../../assets/js/storage/appStorage.js"></script>
  <script src="../../assets/js/services/services.js"></script>
  <script src="../../assets/js/app/app.js"></script>

  <script src="../../assets/js/utils/Form.js"></script>
  <script src="../../assets/js/controllers/user/user.controller.js"></script>

</body>

</html>
