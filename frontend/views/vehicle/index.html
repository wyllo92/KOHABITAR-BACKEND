<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Vehículos</title>
  <!-- Favicon -->
  <link rel="icon" href="../../assets/img/logos/logo.png" type="image/png">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome para iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Data table -->
  <link rel="stylesheet" href="https://cdn.datatables.net/2.3.2/css/dataTables.dataTables.css">
  <!-- Loading -->
  <link rel="stylesheet" href="../../assets/css/loading.css">
</head>

<body>
 
  <!--Container -->
  <div class="container-fluid d-flex flex-column min-vh-100">
   
    <!--Content data-->
    <main>
      <h1 class="text-center mb-4">Gestión de Vehículos</h1>

      <!-- Contenedor de tarjetas de casas -->
      <div class="row mb-4" id="casas-list"></div>

      <!-- Contenedor para mostrar vehículos por propiedad -->
      <button id="btn-volver-listado" class="btn btn-secondary mb-3" style="display:none;">Volver al listado general</button>
      <div id="vehicles-by-property" class="mt-4"></div>

      <!-- Modal -->
      <div class="modal fade" id="appModal" tabindex="-1" aria-labelledby="appModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="appModalLabel">Vehículo</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <!--Form-->
              <form id="vehicleForm">
                <div class="row">
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="model" class="form-label required">Modelo</label>
                      <div class="form-floating">
                        <input type="text" class="form-control" placeholder="Modelo del vehículo" id="model" name="model" required value="">
                        <label for="model">Modelo del Vehículo</label>
                      </div>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="type" class="form-label required">Tipo de Vehículo</label>
                      <div class="form-floating">
                        <select class="form-control" id="type" name="type" required>
                          <option value="" selected disabled>Selecciona el tipo</option>
                          <option value="Carro">Carro</option>
                          <option value="Moto">Moto</option>
                          <option value="Camión">Camión</option>
                          <option value="Bicicleta">Bicicleta</option>
                        </select>
                        <label for="type">Tipo de Vehículo</label>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="color" class="form-label required">Color</label>
                      <div class="form-floating">
                        <input type="text" class="form-control" placeholder="Color del vehículo" id="color" name="color" required value="">
                        <label for="color">Color del Vehículo</label>
                      </div>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="user_id" class="form-label required">Propietario</label>
                      <select class="form-select" id="user_id" name="user_id" required>
                        <option value="" selected disabled>Selecciona el propietario</option>
                      </select>
                    </div>
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="property_id" class="form-label required">Propiedad</label>
                      <select class="form-select" id="property_id" name="property_id" required>
                        <option value="" selected disabled>Selecciona la propiedad</option>
                      </select>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="mb-3">
                      <label for="parkingZone_id" class="form-label">Zona de Parqueo</label>
                      <select class="form-select" id="parkingZone_id" name="parkingZone_id">
                        <option value="" selected disabled>Selecciona la zona de parqueo</option>
                      </select>
                    </div>
                  </div>
                </div>
                <div class="mb-3">
                  <div class="btn-group" role="group" aria-label="Basic mixed styles example">
                    <button type="reset" class="btn btn-outline-secondary me-md-2">
                      <i class="fas fa-undo me-1"></i>Limpiar
                    </button>
                    <button type="submit" class="btn btn-outline-primary me-md-2">
                      <i class="fas fa-paper-plane me-1"></i>Enviar
                    </button>
                  </div>
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cerrar</button>
              </div>
            </div>
          </div>
        </div>
      </div>

    </main>
    <!--End Content data-->

  </div>
  <!--End Container -->
 

  <!--Loading -->
  <div id="loading-screen">
    <div class="spinner-border text-light spinner" role="status">
      <span class="visually-hidden">Loading ...</span>
    </div>
    <p class="mt-3">Cargando datos, por favor espera...</p>
  </div>
  <!--End Loading -->

  <!-- Bootstrap 5 JS Bundle con Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Data table -->
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <script src="https://cdn.datatables.net/2.3.2/js/dataTables.js"></script>
  <!-- JS personalizado -->
  <script src="../../assets/js/app/constants.js"></script>
  <script src="../../assets/js/storage/appStorage.js"></script>
  <script src="../../assets/js/services/services.js"></script> 
  <script src="../../assets/js/app/app.js"></script>
  <script src="../../assets/js/utils/Form.js"></script>
  <script src="../../assets/js/controllers/vehicle/vehicle.controller.js"></script>

</body>

</html>
