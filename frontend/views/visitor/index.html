<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visitantes</title>
  <link rel="icon" href="../../assets/img/logos/logo.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/2.3.2/css/dataTables.dataTables.css">
  <link rel="stylesheet" href="../../assets/css/loading.css">
</head>

<body>
  <div class="container-fluid d-flex flex-column min-vh-100">

    <main>
      <h1 class="text-center mb-4">Gestión de Visitantes</h1>

      <button type="button" title="Agregar Visitante" class="btn btn-primary mb-3" onclick="add()">
        <i class="fa fa-user-plus me-1"></i> Agregar Visitante
      </button>

      <!-- Tabla -->
      <div class="table-responsive">
        <table class="table table-bordered table-hover bg-white shadow-sm text-center" id="app-table">
          <thead>
            <tr class="table-secondary text-center">
              <th>#</th>
              <th>Nombre</th>
              <th>Documento</th>
              <th>Vehículo</th>
              <th>Parqueadero</th>
              <th>Propiedad</th>
              <th>Estado</th>
              <th>Entrada</th>
              <th>Salida</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="app-table-body" class="text-center"></tbody>
          <tfoot>
            <tr class="table-secondary text-center">
              <th>#</th>
              <th>Nombre</th>
              <th>Documento</th>
              <th>Vehículo</th>
              <th>Parqueadero</th>
              <th>Propiedad</th>
              <th>Estado</th>
              <th>Entrada</th>
              <th>Salida</th>
              <th>Acciones</th>
            </tr>
          </tfoot>
        </table>
      </div>

      <!-- Modal -->
      <div class="modal fade" id="appModal" tabindex="-1" aria-labelledby="appModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="appModalLabel">Visitante</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <form id="visitorForm">

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="Visitor_full_name" class="form-label required">Nombre completo</label>
                    <input type="text" class="form-control" id="Visitor_full_name" name="Visitor_full_name" placeholder="Ingrese el nombre completo" required>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="Visitor_id_document" class="form-label required">Documento</label>
                    <input type="text" class="form-control" id="Visitor_id_document" name="Visitor_id_document" placeholder="Ingrese el número de documento" required>
                  </div>
                </div>

                <div class="mb-3">
                  <label for="Property_id" class="form-label required">Propiedad</label>
                  <select class="form-select" id="Property_id" name="Property_id" required>
                    <option value="" disabled selected>Seleccione una propiedad</option>
                  </select>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="visitor_entry_date" class="form-label">Fecha de entrada</label>
                    <input type="date" class="form-control" id="visitor_entry_date" name="visitor_entry_date">
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="visitor_entry_time" class="form-label">Hora de entrada</label>
                    <input type="time" class="form-control" id="visitor_entry_time" name="visitor_entry_time">
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="visitor_exit_date" class="form-label">Fecha de salida</label>
                    <input type="date" class="form-control" id="visitor_exit_date" name="visitor_exit_date">
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="visitor_exit_time" class="form-label">Hora de salida</label>
                    <input type="time" class="form-control" id="visitor_exit_time" name="visitor_exit_time">
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="Vehicle_id" class="form-label">Vehículo</label>
                    <select class="form-select" id="Vehicle_id" name="Vehicle_id">
                      <option value="" selected>Sin vehículo</option>
                    </select>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="parkingSlot_id" class="form-label">Espacio de Parqueo</label>
                    <select class="form-select" id="parkingSlot_id" name="parkingSlot_id">
                      <option value="" selected>Sin parqueadero</option>
                    </select>
                  </div>
                </div>

                <div class="col-12 d-flex justify-content-between mt-3">
                  <button type="reset" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-counterclockwise me-1"></i> Resetear
                  </button>
                  <button type="submit" class="btn btn-success">
                    <i class="bi bi-send-fill me-1"></i> Guardar
                  </button>
                </div>

              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Loading -->
  <div id="loading-screen">
    <div class="spinner-border text-light spinner" role="status">
      <span class="visually-hidden">Loading ...</span>
    </div>
    <p class="mt-3">Cargando datos, por favor espera...</p>
  </div>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <script src="https://cdn.datatables.net/2.3.2/js/dataTables.js"></script>

  <!-- Archivos personalizados -->
  <script src="../../assets/js/app/constants.js"></script>
  <script src="../../assets/js/storage/appStorage.js"></script>
  <script src="../../assets/js/services/services.js"></script>
  <script src="../../assets/js/app/app.js"></script>
  <script src="../../assets/js/utils/Form.js"></script>
  <script src="../../assets/js/controllers/visitor/visitor.controller.js"></script>
</body>

</html>
