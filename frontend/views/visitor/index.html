<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Visitantes</title>
  <link rel="icon" href="../../assets/img/logos/logo.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/2.3.2/css/dataTables.dataTables.css">
  <link rel="stylesheet" href="../../assets/css/loading.css">
</head>
<body>
  <div class="container-fluid d-flex flex-column min-vh-100">
    <main>
      <h1 class="text-center mb-4">Gestión de Visitantes</h1>
      <button type="button" title="Agregar Visitante" class="btn btn-primary mb-3" onclick="addVisitor()">
        <i class="fa fa-user-plus me-1"></i>Agregar Visitante
      </button>
      <div class="table-responsive">
        <table class="table table-dark table-hover" id="visitor-table">
          <thead>
            <tr class="table-primary text-center">
              <th>#</th>
              <th>Nombre</th>
              <th>Documento</th>
              <th>Motivo</th>
              <th>Entrada</th>
              <th>Salida</th>
              <th>Autorizado por</th>
              <th>Propiedad</th>
              <th>Estado</th>
              <th>Vehículo</th>
              <th>Parqueo</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="visitor-table-body" class="text-center"></tbody>
          <tfoot>
            <tr class="table-primary text-center">
              <td>#</td>
              <td>Nombre</td>
              <td>Documento</td>
              <td>Motivo</td>
              <td>Entrada</td>
              <td>Salida</td>
              <td>Autorizado por</td>
              <td>Propiedad</td>
              <td>Estado</td>
              <td>Vehículo</td>
              <td>Parqueo</td>
              <td>Acciones</td>
            </tr>
          </tfoot>
        </table>
      </div>
      <!-- Modal -->
      <div class="modal fade" id="visitorModal" tabindex="-1" aria-labelledby="visitorModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="visitorModalLabel">Visitante</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <form id="visitorForm">
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="Visitor_full_name" class="form-label required">Nombre Completo</label>
                    <input type="text" class="form-control" id="Visitor_full_name" name="Visitor_full_name" required>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="Visitor_id_document" class="form-label required">Documento</label>
                    <input type="text" class="form-control" id="Visitor_id_document" name="Visitor_id_document" required>
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="Visitor_visit_reason" class="form-label required">Motivo de Visita</label>
                    <input type="text" class="form-control" id="Visitor_visit_reason" name="Visitor_visit_reason" required>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="Visitor_authorized_by" class="form-label required">Autorizado por</label>
                    <input type="text" class="form-control" id="Visitor_authorized_by" name="Visitor_authorized_by" required>
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="Property_id" class="form-label required">Propiedad</label>
                    <input type="number" class="form-control" id="Property_id" name="Property_id" required>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="Status_id" class="form-label required">Estado</label>
                    <select class="form-control" id="Status_id" name="Status_id" required>
                      <option value="1">Activo</option>
                      <option value="2">Inactivo</option>
                      <option value="3">Pendiente</option>
                      <option value="4">Finalizado</option>
                    </select>
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="Vehicle_id" class="form-label">Vehículo (opcional)</label>
                    <input type="number" class="form-control" id="Vehicle_id" name="Vehicle_id">
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="parkingSlot_id" class="form-label">Parqueadero (opcional)</label>
                    <input type="number" class="form-control" id="parkingSlot_id" name="parkingSlot_id">
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="Visitor_entry_time" class="form-label required">Hora de Entrada</label>
                    <input type="datetime-local" class="form-control" id="Visitor_entry_time" name="Visitor_entry_time" required>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="Visitor_exit_time" class="form-label">Hora de Salida</label>
                    <input type="datetime-local" class="form-control" id="Visitor_exit_time" name="Visitor_exit_time">
                  </div>
                </div>
                <div class="mb-3">
                  <div class="btn-group" role="group">
                    <button type="reset" class="btn btn-outline-secondary me-md-2">
                      <i class="fas fa-undo me-1"></i>Limpiar
                    </button>
                    <button type="submit" class="btn btn-outline-primary me-md-2">
                      <i class="fas fa-paper-plane me-1"></i>Enviar
                    </button>
                  </div>
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cerrar</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <div id="loading-screen">
    <div class="spinner-border text-light spinner" role="status">
      <span class="visually-hidden">Loading ...</span>
    </div>
    <p class="mt-3">Cargando datos, por favor espera...</p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <script src="https://cdn.datatables.net/2.3.2/js/dataTables.js"></script>
  <script src="../../assets/js/app/constants.js"></script>
  <script src="../../assets/js/storage/appStorage.js"></script>
  <script src="../../assets/js/services/services.js"></script>
  <script src="../../assets/js/app/app.js"></script>
  <script src="../../assets/js/utils/Form.js"></script>
  <script src="../../assets/js/controllers/visitor/visitor.controller.js"></script>
</body>
</html>
