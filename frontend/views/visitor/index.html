<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visitantes</title>
  <!-- Favicon -->
  <link rel="icon" href="../../assets//img/logos/logo.png" type="image/png">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Data table -->
  <link rel="stylesheet" href="https://cdn.datatables.net/2.3.2/css/dataTables.dataTables.css">
  <!-- Loading -->
  <link rel="stylesheet" href="../../assets/css/loading.css">
</head>

<body>

  <div class="container-fluid">
    <main>
      <h1 class="text-center">Gestión de Visitantes</h1>
      <button type="button" title="Add Visitor" class="btn btn-primary mb-3" onclick="add()"> <i
          class="fa fa-user-plus me-1"></i> Agregar Visitante</button>
      <!-- El sistema proporciona botón para exportar visitantes a PDF -->
      <button type="button" title="Exportar Visitantes a PDF" class="btn btn-danger mb-3 ms-2" onclick="exportVisitorsToPDF()">
        <i class="fas fa-file-pdf me-1"></i>Exportar PDF
      </button>
      <!-- El sistema proporciona botón para exportar visitantes a Excel -->
      <button type="button" title="Exportar Visitantes a Excel" class="btn btn-success mb-3 ms-2" onclick="exportVisitorsToExcel()">
        <i class="fas fa-file-excel me-1"></i>Exportar Excel
      </button>

      <div class="table-responsive">
        <table class="table table-bordered table-hover bg-white shadow-sm text-center" id="app-table">
          <thead class="thead-dark">
            <tr class="table-secondary text-center">
              <th class="text-center">#</th>
              <th class="text-center">Nombre</th>
              <th class="text-center">Documento</th>
              <th class="text-center">Vehículo</th>
              <th class="text-center">Propiedad</th>
              <th class="text-center">Estado</th>
              <th class="text-center">Entrada</th>
              <th class="text-center">Salida</th>
              <th class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody id="app-table-body" class="text-center">

          </tbody>
          <tfoot>
            <tr class="table-secondary text-center">
              <td class="text-center">#</td>
              <td class="text-center">Nombre</td>
              <td class="text-center">Documento</td>
              <td class="text-center">Vehículo</td>
              <td class="text-center">Propiedad</td>
              <td class="text-center">Estado</td>
              <td class="text-center">Entrada</td>
              <td class="text-center">Salida</td>
              <td class="text-center">Acciones</td>
            </tr>
          </tfoot>
        </table>
      </div>

      <!-- Modal -->
      <div class="modal fade" id="appModal" tabindex="-1" aria-labelledby="appModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg" style="margin-top: 2rem;">
          <div class="modal-content shadow-lg border-0 rounded-4">
            <div class="modal-header bg-primary text-white rounded-top-4">
              <h5 class="modal-title d-flex align-items-center" id="appModalLabel">
                <i class="bi bi-person-plus me-2"></i> Visitante
              </h5>
              <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <form id="visitorForm" class="row g-3">

                <div class="col-md-6">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="Visitor_full_name" name="Visitor_full_name" placeholder="Nombre completo" required>
                    <label for="Visitor_full_name">Nombre completo</label>
                  </div>
                </div>

                <div class="col-md-6">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="Visitor_id_document" name="Visitor_id_document" placeholder="Documento" required>
                    <label for="Visitor_id_document">Documento</label>
                  </div>
                </div>

                <div class="col-md-6">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="Visitor_visit_reason" name="Visitor_visit_reason" placeholder="Motivo de visita" required>
                    <label for="Visitor_visit_reason">Motivo de visita</label>
                  </div>
                </div>

                <div class="col-md-6">
                  <div class="form-floating">
                    <input type="number" class="form-control" id="Visitor_authorized_by" name="Visitor_authorized_by" placeholder="Autorizado por" min="1">
                    <label for="Visitor_authorized_by">Autorizado por (usuario anfitrión)</label>
                  </div>
                </div>

                <div class="col-md-6">
                  <label for="Property_id" class="form-label fw-semibold">Propiedad</label>
                  <select class="form-select" id="Property_id" name="Property_id" required>
                    <option value="">-- Seleccione --</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label for="Status_id" class="form-label fw-semibold">Estado</label>
                  <select class="form-select" id="Status_id" name="Status_id" required>
                    <option value="">-- Seleccione --</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label for="Vehicle_id" class="form-label fw-semibold">Vehículo (opcional)</label>
                  <select class="form-select" id="Vehicle_id" name="Vehicle_id">
                    <option value="">-- Seleccione --</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label for="parkingSlot_id" class="form-label fw-semibold">Espacio de Parqueo (opcional)</label>
                  <select class="form-select" id="parkingSlot_id" name="parkingSlot_id">
                    <option value="">-- Seleccione --</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <div class="form-floating">
                    <input type="date" class="form-control" id="visitor_entry_date" name="visitor_entry_date" placeholder="Fecha de entrada">
                    <label for="visitor_entry_date">Fecha de entrada</label>
                  </div>
                </div>

                <div class="col-md-6">
                  <div class="form-floating">
                    <input type="time" class="form-control" id="visitor_entry_time" name="visitor_entry_time" placeholder="Hora de entrada">
                    <label for="visitor_entry_time">Hora de entrada</label>
                  </div>
                </div>

                <div class="col-md-6">
                  <div class="form-floating">
                    <input type="date" class="form-control" id="visitor_exit_date" name="visitor_exit_date" placeholder="Fecha de salida">
                    <label for="visitor_exit_date">Fecha de salida</label>
                  </div>
                </div>

                <div class="col-md-6">
                  <div class="form-floating">
                    <input type="time" class="form-control" id="visitor_exit_time" name="visitor_exit_time" placeholder="Hora de salida">
                    <label for="visitor_exit_time">Hora de salida</label>
                  </div>
                </div>

                <div class="col-12 d-flex justify-content-between mt-3">
                  <button type="reset" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-counterclockwise me-1"></i> Resetear
                  </button>
                  <button type="submit" class="btn btn-success">
                    <i class="bi bi-send-fill me-1"></i> Enviar
                  </button>
                </div>

              </form>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <div id="loading-screen">
    <div class="spinner-border text-light spinner" role="status">
      <span class="visually-hidden">Loading ...</span>
    </div>
    <p class="mt-3">Data loading, please wait...</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <script src="https://cdn.datatables.net/2.3.2/js/dataTables.js"></script>
  <script src="../../assets/js/app/constants.js"></script>
  <script src="../../assets/js/storage/appStorage.js"></script>
  <script src="../../assets/js/services/services.js"></script>
  <script src="../../assets/js/app/app.js"></script>

  <script src="../../assets/js/utils/Form.js"></script>
  <script src="../../assets/js/controllers/visitor/visitor.controller.js"></script>

</body>

</html>
